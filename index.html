<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車輛查定系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --paper:#F4F5F0;
  --surface:#FFFFFF;
  --surface-alt:#ECEEE6;
  --ink:#171B2E;
  --ink-soft:#5B6273;
  --line:#DBDDD2;
  --line-strong:#B9BCAE;
  --stamp:#B23A2A;
  --stamp-dark:#8C2C1F;
  --blue:#2C6E8E;
  --blue-dark:#1F4F66;
  --amber:#D9932E;
  --ok:#3E7D4C;
  --danger:#B23A2A;
  --radius:3px;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Noto Sans TC','IBM Plex Mono',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:var(--sans);}
::selection{background:var(--stamp);color:#fff;}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.mono{font-family:var(--mono);}
.scroll{overflow:auto;}

/* ---------- Login ---------- */
#loginScreen{
  height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(178,58,42,0.06), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(44,110,142,0.08), transparent 45%),
    var(--paper);
  position:relative;
}
.login-card{
  background:var(--surface);
  border:1px solid var(--line);
  width:380px;
  padding:44px 40px 36px;
  position:relative;
  box-shadow:0 20px 50px -20px rgba(23,27,46,0.25);
}
.login-card::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--stamp),var(--blue));
}
.stamp-mark{
  width:74px;height:74px;border-radius:50%;
  border:3px solid var(--stamp);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  transform:rotate(-8deg);
  color:var(--stamp);
  font-weight:900;font-size:28px;font-family:var(--mono);
  position:relative;
}
.stamp-mark::after{
  content:"";position:absolute;inset:-8px;border:1px dashed var(--stamp);border-radius:50%;opacity:.45;
}
.login-title{text-align:center;font-size:22px;font-weight:900;letter-spacing:2px;margin-bottom:2px;}
.login-sub{text-align:center;color:var(--ink-soft);font-size:12px;letter-spacing:3px;margin-bottom:30px;font-family:var(--mono);text-transform:uppercase;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:6px;letter-spacing:1px;font-family:var(--mono);text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);background:var(--paper);
  font-size:14px;border-radius:var(--radius);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue);}
.btn{
  border:none;cursor:pointer;padding:11px 18px;font-size:13px;font-weight:700;border-radius:var(--radius);
  letter-spacing:.5px;transition:transform .08s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:#fff;width:100%;}
.btn-primary:hover{background:#000;}
.btn-stamp{background:var(--stamp);color:#fff;}
.btn-stamp:hover{background:var(--stamp-dark);}
.btn-blue{background:var(--blue);color:#fff;}
.btn-blue:hover{background:var(--blue-dark);}
.btn-ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-sm{padding:6px 10px;font-size:12px;}
.btn-danger{background:var(--danger);color:#fff;}
.login-err{color:var(--stamp);font-size:12px;text-align:center;margin-top:12px;min-height:14px;font-family:var(--mono);}
.login-hint{margin-top:22px;text-align:center;font-size:11px;color:var(--ink-soft);font-family:var(--mono);}

/* ---------- App shell ---------- */
#app{display:flex;height:100vh;}
#sidebar{
  width:210px;flex-shrink:0;background:var(--ink);color:#fff;
  display:flex;flex-direction:column;transition:width .18s ease;position:relative;
}
#sidebar.collapsed{width:0;overflow:hidden;}
.brand-row{
  display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,0.1);
}
.brand-row .stamp-mini{
  width:32px;height:32px;border-radius:50%;border:2px solid var(--stamp);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:13px;color:var(--stamp);flex-shrink:0;
}
.brand-row .brand-text{font-size:13px;font-weight:700;letter-spacing:1px;line-height:1.3;}
.brand-text small{display:block;font-family:var(--mono);font-size:9px;color:#9aa0b4;letter-spacing:2px;font-weight:400;}
nav.navlist{flex:1;padding:14px 10px;overflow:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;
  font-size:13px;color:#c7cadb;margin-bottom:2px;font-family:var(--mono);letter-spacing:.5px;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--stamp);color:#fff;}
.nav-item .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6;flex-shrink:0;}
.sidebar-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:#9aa0b4;font-family:var(--mono);}
.sidebar-foot .who{color:#fff;font-weight:700;margin-bottom:4px;}
.sidebar-foot a{color:#c7cadb;cursor:pointer;text-decoration:underline;}

#mainWrap{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{
  height:54px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 18px;
  border-bottom:1px solid var(--line);background:var(--surface);
}
#storageWarning{
  background:#FBEDEA;color:var(--stamp);border-bottom:1px solid var(--stamp);
  padding:8px 18px;font-size:12.5px;font-weight:600;
}
#localModeNotice{
  background:#EAF2F5;color:var(--blue-dark);border-bottom:1px solid var(--blue);
  padding:8px 18px;font-size:12.5px;font-weight:600;
}
#toggleSidebar{
  width:32px;height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);flex-shrink:0;
}
#topbar .page-title{font-weight:800;font-size:15px;letter-spacing:1px;}
#topbar .page-sub{font-family:var(--mono);font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
#mainContent{flex:1;overflow:auto;padding:22px;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.panel h3{margin:0 0 14px;font-size:14px;letter-spacing:2px;font-family:var(--mono);text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--ink);padding-bottom:8px;display:flex;align-items:center;justify-content:space-between;}

/* ---------- Tabs ---------- */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
.tabbtn{
  padding:10px 16px;font-size:12.5px;font-weight:700;border:none;background:transparent;cursor:pointer;
  color:var(--ink-soft);border-bottom:3px solid transparent;letter-spacing:.5px;
}
.tabbtn.active{color:var(--ink);border-bottom-color:var(--stamp);}
.tabpane{display:none;}
.tabpane.active{display:block;}

/* ---------- Grids ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr);}.grid7{grid-template-columns:repeat(3,1fr);}.grid5{grid-template-columns:repeat(2,1fr);}.grid3{grid-template-columns:repeat(2,1fr);}}

.eq-item{
  border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px;background:var(--paper);
  display:flex;flex-direction:column;gap:6px;font-size:12px;
}
.eq-item label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;}
.eq-item input[type=number]{width:100%;padding:4px 6px;font-size:12px;border:1px solid var(--line-strong);border-radius:2px;}
.eq-item.checked{border-color:var(--blue);background:#EAF2F5;}

.fc-item{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:var(--paper);font-size:12.5px;}
.fc-item label{display:flex;align-items:center;gap:8px;cursor:pointer;}
.fc-item.checked{border-color:var(--stamp);background:#FBEDEA;}
.fc-category-block{margin-bottom:18px;}
.fc-category-title{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase;border-bottom:2px solid var(--stamp);padding-bottom:6px;margin-bottom:10px;}
.fc-category-grid{display:grid;gap:10px;}

/* ---------- Diagram ---------- */
.diagram-wrap{position:relative;border:1px solid var(--line-strong);background:#fff;border-radius:var(--radius);overflow:hidden;}
.diagram-wrap svg{display:block;width:100%;height:auto;cursor:crosshair;}
.diagram-wrap img.diagram-bg{display:block;width:100%;height:auto;cursor:crosshair;background:#fff;}
.diagram-wrap.portrait{max-width:420px;margin:0 auto;}
.diag-label{
  position:absolute;font-family:Arial,sans-serif;font-weight:700;color:#1E5FA8;font-size:28px;
  cursor:move;user-select:none;line-height:1;transform:translate(-50%,-50%);padding:1px 3px;white-space:nowrap;
}
.diag-label.yellow-x{background:#F5D442;border-radius:2px;}
.diag-label .del-x{
  position:absolute;top:-9px;right:-11px;width:15px;height:15px;border-radius:50%;background:var(--stamp);color:#fff;
  font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--sans);font-weight:700;
}
.diag-auto-badge{
  position:absolute;top:8px;left:8px;background:var(--stamp);color:#fff;font-family:var(--mono);font-weight:700;
  font-size:11px;padding:3px 8px;border-radius:2px;letter-spacing:1px;
}
.diag-toolbar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;align-items:center;}
.diag-symbol-popup{
  position:absolute;z-index:50;background:#fff;border:1px solid var(--line-strong);border-radius:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px;min-width:200px;max-width:240px;
}
.diag-symbol-popup .popup-hint{font-size:10.5px;color:var(--ink-soft);font-family:var(--mono);margin-bottom:6px;}
.diag-symbol-popup .popup-syms{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.diag-symbol-popup .popup-actions{display:flex;gap:6px;}
.diag-symbol-popup .popup-actions .btn{flex:1;}
.sym-btn{
  min-width:34px;padding:6px 8px;border:1px solid var(--line-strong);background:#fff;border-radius:3px;cursor:pointer;
  font-family:Arial,sans-serif;font-weight:700;font-size:14px;color:#1E5FA8;
}
.sym-btn.active{background:#1E5FA8;color:#fff;}
.diag-meta{display:flex;gap:20px;margin-top:10px;font-family:var(--mono);font-size:12px;flex-wrap:wrap;}
.diag-meta .m{display:flex;align-items:center;gap:6px;}
.diag-meta input{width:60px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:2px;}

/* ---------- Records table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;}
th{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase;background:var(--surface-alt);}
tr:hover td{background:#FAFAF5;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono);}
.badge-active{background:#E3F0E6;color:var(--ok);}
.badge-off{background:#F1E4E2;color:var(--danger);}
.searchbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.searchbar input{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:var(--radius);font-size:13px;}

/* record cards, 3 per row */
.rec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:1000px){.rec-grid{grid-template-columns:repeat(1,1fr);}}
.rec-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--surface);}
.rec-card .plate{font-family:var(--mono);font-weight:800;font-size:18px;letter-spacing:1px;}
.rec-card .sub{font-size:12px;color:var(--ink-soft);margin:4px 0 10px;}
.rec-card .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.rec-card .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

/* photos grid */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
.photo-slot{
  border:1px dashed var(--line-strong);border-radius:var(--radius);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;background:var(--paper);font-size:10px;color:var(--ink-soft);text-align:center;font-family:var(--mono);
}
.photo-slot img{width:100%;height:100%;object-fit:cover;}
.photo-slot .idx{position:absolute;top:2px;left:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:0 4px;border-radius:2px;}
.photo-slot .rm{position:absolute;top:2px;right:2px;background:var(--stamp);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;}

/* notes / phrase chips */
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.chip{
  padding:6px 12px;border:1px solid var(--line-strong);border-radius:20px;font-size:12px;cursor:pointer;background:#fff;
}
.chip.on{background:var(--stamp);border-color:var(--stamp);color:#fff;}
.notelist{list-style:none;margin:0;padding:0;}
.notelist li{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;background:var(--paper);}
.notelist li button{background:none;border:none;color:var(--stamp);cursor:pointer;font-size:12px;font-weight:700;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(23,27,46,0.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-box{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;}
.modal-box h3{margin-top:0;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* toast */
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--radius);font-size:13px;z-index:400;box-shadow:0 10px 30px rgba(0,0,0,.25);}

/* section header + add btn */
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}

/* status pill for dispatch */
.pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono);}
.pill-pending{background:#F1E9D8;color:var(--amber);}
.pill-progress{background:#E3EEF3;color:var(--blue);}
.pill-done{background:#E3F0E6;color:var(--ok);}

/* ---------- Print / PDF template (matches 高雄冠宥汽車車輛查定表 paper form) ---------- */
#reportTemplate{position:fixed;top:0;left:0;width:794px;background:#fff;color:#111;font-family:var(--sans);opacity:0;pointer-events:none;z-index:-1;}
.rp-page{width:794px;padding:26px 30px;background:#fff;border:1px solid #000;}
.rp-photo-page{margin-top:14px;}

.rp-co-header{text-align:center;border-bottom:3px solid #000;padding-bottom:8px;margin-bottom:10px;}
.rp-co-header-sm{padding-bottom:6px;margin-bottom:14px;}
.rp-co-name{font-size:20px;font-weight:900;letter-spacing:6px;}
.rp-co-sub{font-size:11px;font-family:var(--mono);color:#555;letter-spacing:2px;margin-top:3px;}

.rp-info-table{width:100%;border-collapse:collapse;border:1.5px solid #000;font-size:1em;margin-bottom:12px;}
.rp-info-table td{border:1px solid #000;padding:5px 8px;vertical-align:middle;}
.rp-info-table .rp-blank{width:70px;}
.rp-info-table b{font-weight:700;}
.rp-grade-cell{width:110px;text-align:center;font-size:11px;letter-spacing:2px;font-weight:700;vertical-align:middle;}
.rp-grade-val{font-size:28px;font-weight:900;font-family:var(--mono);margin-top:6px;}

.rp-block-title{font-size:12px;font-weight:900;letter-spacing:3px;border:1px solid #000;border-bottom:none;background:#EEEEEE;padding:4px 10px;}
.rp-chk-grid{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:0.85em;border:1px solid #000;padding:5px 10px;margin-bottom:8px;}
.rp-fc-categories{border:1px solid #000;border-top:none;padding:4px 10px 2px;margin-bottom:8px;}
.rp-fc-category{margin-bottom:4px;}
.rp-fc-category-title{font-size:0.8em;font-weight:700;color:#555;margin:4px 0 2px;}
.rp-fc-category .rp-chk-grid{border:none;padding:0;margin-bottom:2px;}
.rp-chk-i{display:flex;align-items:center;gap:4px;padding:2px 0;white-space:normal;line-height:1.3;}
.rp-box{font-size:13px;flex-shrink:0;}

.rp-notes-box{border:1px solid #000;border-top:none;min-height:42px;padding:6px 10px;margin-bottom:10px;overflow:hidden;}
.rp-notes-box p{font-size:12px;margin:2px 0;white-space:nowrap;}

.rp-diagrams-row{display:flex;gap:16px;margin-bottom:8px;justify-content:center;}
/* Fixed (not flex:1) width — this keeps the two diagrams compact enough that the
   whole report reliably fits on ONE page. The image itself still fills 100% of ITS
   OWN column at that fixed width, so the click-mark percentage coordinates (computed
   the same way in the editor) still land in exactly the right spot — only the overall
   column size shrank, the width:100% relationship that the % math depends on did not. */
.rp-diagram-col{flex:0 0 340px;text-align:center;}
.rp-diagram-title{font-size:11px;font-weight:900;letter-spacing:3px;margin-bottom:4px;}
.rp-diagram-box{position:relative;border:1px solid #999;}
.rp-diagram-box img{width:100%;display:block;}
.rp-diaglabel{position:absolute;font-family:Arial,sans-serif;font-weight:700;color:#1E5FA8;transform:translate(-50%,-50%);font-size:20px;}
.rp-diaglabel.yellow-x{background:#F5D442;padding:1px 2px;}

.rp-bottom-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #000;padding-top:12px;font-size:12.5px;}
.rp2-bottom-row{display:flex;gap:14px;margin-top:12px;align-items:flex-start;}
.rp2-notes-block{flex:2;}
.rp2-notes-inline{border:1px solid #000;border-top:none;padding:6px 10px;font-size:11.5px;background:#FAFAF5;}
.rp2-sign-block{flex:1;}
.rp2-sign-note{font-size:9.5px;color:#666;margin-bottom:6px;}
.rp2-sign-table{width:100%;border-collapse:collapse;}
.rp2-sign-table td{border:1px solid #000;text-align:center;padding:6px;font-size:11.5px;}
.rp-bottom-item b{font-family:var(--mono);}
.rp-inspector{margin-left:auto;}

.rp-photos{display:flex;flex-wrap:wrap;gap:8px;}
.rp-photos img{width:calc(25% - 6px);height:133px;object-fit:cover;border:1px solid #ccc;}
.rp-photos .ph-empty{width:calc(25% - 6px);height:133px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:9px;color:#999;}

/* ---------- Responsive: tablet / mobile ---------- */
#sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(15,17,30,0.5);z-index:140;}
#sidebarBackdrop.show{display:block;}

@media (max-width: 1024px){
  .grid4{grid-template-columns:repeat(2,1fr);}
  .grid5{grid-template-columns:repeat(3,1fr);}
  .grid7{grid-template-columns:repeat(4,1fr);}
  .rec-grid{grid-template-columns:repeat(2,1fr);}
}

@media (max-width: 860px){
  #sidebar{
    position:fixed;top:0;left:0;height:100vh;z-index:150;width:250px;
    transform:translateX(-100%);transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.35);
  }
  #sidebar.collapsed{width:250px;transform:translateX(-100%);}
  #sidebar:not(.collapsed){transform:translateX(0);}
  #mainContent{padding:14px;}
  #topbar{padding:0 12px;}
  #topbar .page-title{font-size:14px;}
  .panel{padding:14px;}
  .grid3{grid-template-columns:repeat(2,1fr);}
  .grid4{grid-template-columns:repeat(2,1fr);}
  .grid5{grid-template-columns:repeat(2,1fr);}
  .grid7{grid-template-columns:repeat(3,1fr);}
  /* #eqGrid/#fcGrid get their column count set via inline style from JS (so the PDF
     report's configured column count doesn't affect the live editing UI) — inline
     styles otherwise beat this media query, hence the !important overrides here. */
  #eqGrid, .fc-category-grid{grid-template-columns:repeat(3,1fr) !important;}
  .rec-grid{grid-template-columns:1fr;}
  .photo-grid{grid-template-columns:repeat(3,minmax(80px,1fr));}
  .tabbar{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
  .tabbtn{flex-shrink:0;white-space:nowrap;}
  table{display:block;}
  table thead, table tbody, table tr{display:block;}
  table thead{display:none;}
  table tr{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;padding:6px 4px;}
  table td{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:6px 8px;text-align:right;}
  table td:before{content:attr(data-label);font-family:var(--mono);font-size:10px;color:var(--ink-soft);text-align:left;letter-spacing:1px;}
  .diag-toolbar{gap:5px;}
  .sym-btn{min-width:28px;padding:5px 6px;font-size:12px;}
  .modal-box{padding:16px;max-height:92vh;}
  .searchbar{flex-direction:column;}
  .section-head{flex-direction:column;align-items:flex-start;gap:10px;}
  .section-head button{align-self:stretch;}
}

@media (max-width: 480px){
  .grid3,.grid4,.grid5{grid-template-columns:1fr;}
  .grid7{grid-template-columns:repeat(2,1fr);}
  #eqGrid, .fc-category-grid{grid-template-columns:repeat(2,1fr) !important;}
  .photo-grid{grid-template-columns:repeat(2,minmax(70px,1fr));}
  .login-card{width:100%;padding:32px 22px 26px;}
  .rec-card .actions{flex-direction:column;}
  .rec-card .actions .btn{width:100%;}
  .diag-meta{flex-direction:column;gap:8px;}
}

/* print mode: only report visible */
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>

// small helper: retry a flaky storage call once after a short delay before giving up.
// Mobile networks / the storage backend occasionally return a transient error
// ("Internal server error while processing action") — a single retry clears most of these.

// This file is a standalone deliverable (downloaded / opened directly), not something
// rendered inside Claude.ai's own artifact sandbox — so window.storage (Claude's
// injected cloud key-value API) is not expected to exist here. Rather than fail
// outright, everything goes through this Storage wrapper: it uses window.storage when
// it happens to be present, and otherwise transparently falls back to the browser's
// own localStorage so the app still works, saving data to THIS browser/device.
// NOTE: local storage is per-browser — it will not be shared between different
// computers or between different browsers on the same computer.
function cloudStorageAvailable(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function'
    && typeof window.storage.get === 'function' && typeof window.storage.delete === 'function'
    && typeof window.storage.list === 'function';
}

const USE_CLOUD_STORAGE = cloudStorageAvailable();

// --- Optional real multi-device cloud sync via Firebase Firestore ---------------
// window.storage (Claude's own API) only exists when this file happens to be running
// inside Claude's own preview sandbox — for a downloaded/standalone file it normally
// won't. To get genuine cross-device / multi-user shared storage, the shop can connect
// their own free Firebase project (see the "雲端同步設定" admin page). The config itself
// has to live in THIS browser's localStorage, since it's needed before any other data
// can be fetched — but once every device/browser has the same config entered, they all
// read and write the same shared Firestore database.
const FIREBASE_CONFIG_KEY = 'vis_firebase_config';
const FIRESTORE_COLLECTION = 'vis_kv_store';
let firestoreDb = null;
let USE_FIREBASE = false;

function getFirebaseConfig(){
  try{
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
let lastFirebaseError = null;
function withTimeout(promise, ms, timeoutMessage){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=>reject(new Error(timeoutMessage||('逾時（超過 '+ms+'ms 未回應）'))), ms))
  ]);
}
async function initFirebase(){
  if(USE_CLOUD_STORAGE) return; // Claude's own storage takes priority when present
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.apiKey || !cfg.projectId) return;
  try{
    if(typeof firebase === 'undefined') throw new Error('Firebase SDK 尚未載入（請確認網路連線，或該網路是否封鎖 gstatic.com）');
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
    firestoreDb = firebase.firestore();
    // touch the DB once so a bad config/permission problem surfaces now, not on first save.
    // IMPORTANT: this is wrapped in a hard timeout — without one, a misconfigured project
    // (bad security rules, wrong database type, network issues) can leave this hanging
    // indefinitely, which previously blocked loadDB() from EVER running and silently broke
    // login entirely (DB stayed null, so clicking "登入" threw and did nothing visible).
    await withTimeout(
      firestoreDb.collection(FIRESTORE_COLLECTION).doc('__connectivity_check__').get(),
      6000,
      '連線逾時（6 秒內未回應，請確認網路連線或 Firebase 專案設定）'
    );
    USE_FIREBASE = true;
    lastFirebaseError = null;
  }catch(e){
    console.error('Firebase init failed', e);
    USE_FIREBASE = false;
    firestoreDb = null;
    lastFirebaseError = (e && (e.code ? (e.code+': '+e.message) : e.message)) || String(e);
  }
}
// --- Optional real multi-device cloud sync via a Google Sheet ------------------
// Alternative to Firebase: a tiny Google Apps Script "Web App" turns one Google Sheet
// into a simple key-value API (get/set/delete/list). The person keeps the Web App URL
// (and a shared token) in localStorage, same idea as the Firebase config.
const GSHEETS_CONFIG_KEY = 'vis_gsheets_config';
let USE_GSHEETS = false;
let lastGSheetsError = null;
function getGSheetsConfig(){
  try{
    const raw = localStorage.getItem(GSHEETS_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
// Sends the request body as text/plain (not application/json) on purpose — that keeps
// it a CORS "simple request" so the browser skips the preflight OPTIONS call, which
// Google Apps Script Web Apps generally don't handle well and would otherwise fail.
async function gsheetsRequest(action, params){
  const cfg = getGSheetsConfig();
  if(!cfg || !cfg.url) throw new Error('尚未設定 Google 試算表連線資訊');
  const body = Object.assign({action, token: cfg.token||''}, params||{});
  const res = await withTimeout(
    fetch(cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }),
    8000,
    '連線逾時（8 秒內未回應，請確認網路連線或 Google 試算表 Web App 設定）'
  );
  let data;
  try{ data = await res.json(); }
  catch(e){ throw new Error('回應格式錯誤，請確認 Web App 網址是否正確、是否已部署為「任何人皆可存取」'); }
  if(data.error) throw new Error(data.error);
  return data;
}
async function initGSheets(){
  if(USE_CLOUD_STORAGE || USE_FIREBASE) return; // higher-priority backends win when present
  const cfg = getGSheetsConfig();
  if(!cfg || !cfg.url) return;
  try{
    await gsheetsRequest('list', {prefix: '__connectivity_check__'});
    USE_GSHEETS = true;
    lastGSheetsError = null;
  }catch(e){
    console.error('Google Sheets init failed', e);
    USE_GSHEETS = false;
    lastGSheetsError = (e && e.message) || String(e);
  }
}

// --- Optional real multi-device cloud sync via JSONBin.io -----------------------
// The simplest of the three cloud options: no code to write, no deployment step —
// just a free account and one API key. JSONBin stores one JSON document per "bin";
// since our Storage interface needs many independent keys (settings + one per record
// + one per photo), we keep ONE bin holding a single JSON object that maps
// key -> value, and read/modify/write that whole object for each operation. A short
// local cache avoids re-fetching the whole bin on every single read during a normal
// page load (which does many Storage.get calls in a row), while writes always fetch
// a fresh copy first to keep the "last write wins" race window as small as practical.
const JSONBIN_CONFIG_KEY = 'vis_jsonbin_config';
const JSONBIN_API = 'https://api.jsonbin.io/v3';
let USE_JSONBIN = false;
let lastJSONBinError = null;
let jsonbinCache = null;
let jsonbinCacheAt = 0;
// Cleans up the two common copy-paste mistakes people make with an API key: selecting
// the whole "X-Master-Key: xxx" line (label included) instead of just the value, and
// invisible/smart-quote characters riding along in the clipboard. fetch() headers can
// only contain ISO-8859-1 bytes, so anything outside printable ASCII breaks with a
// cryptic "non ISO-8859-1 code point" error otherwise.
function sanitizeApiKeyString(s){
  if(!s) return s;
  let v = String(s).trim();
  v = v.replace(/^x-master-key\s*:?\s*/i, '');
  v = v.replace(/[^\x20-\x7E]/g, '');
  return v.trim();
}
function getJSONBinConfig(){
  try{
    const raw = localStorage.getItem(JSONBIN_CONFIG_KEY);
    if(!raw) return null;
    const cfg = JSON.parse(raw);
    // heal any bad value already sitting in storage from before this cleanup existed —
    // applied on every read, so it fixes itself on the very next page load, not just
    // the next time the person re-saves the settings form.
    if(cfg && cfg.apiKey){
      const cleaned = sanitizeApiKeyString(cfg.apiKey);
      if(cleaned !== cfg.apiKey){
        cfg.apiKey = cleaned;
        try{ localStorage.setItem(JSONBIN_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
      }
    }
    return cfg;
  }catch(e){ return null; }
}
async function jsonbinErrorDetail(res){
  try{
    const body = await res.json();
    return 'HTTP '+res.status+(body && body.message ? '：'+body.message : '');
  }catch(e){
    return 'HTTP '+res.status;
  }
}
async function jsonbinFetchLatest(){
  const cfg = getJSONBinConfig();
  if(!cfg || !cfg.apiKey || !cfg.binId) throw new Error('尚未設定 JSONBin 連線資訊');
  const res = await withTimeout(
    fetch(JSONBIN_API+'/b/'+cfg.binId+'/latest', { headers: {'X-Master-Key': cfg.apiKey} }),
    8000,
    '連線逾時（8 秒內未回應，請確認網路連線）'
  );
  if(!res.ok) throw new Error(await jsonbinErrorDetail(res));
  const data = await res.json();
  jsonbinCache = data.record || {};
  jsonbinCacheAt = Date.now();
  return jsonbinCache;
}
async function jsonbinPutAll(obj){
  const cfg = getJSONBinConfig();
  if(!cfg || !cfg.apiKey || !cfg.binId) throw new Error('尚未設定 JSONBin 連線資訊');
  const res = await withTimeout(
    fetch(JSONBIN_API+'/b/'+cfg.binId, {
      method: 'PUT',
      headers: {'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey},
      body: JSON.stringify(obj)
    }),
    8000,
    '連線逾時（8 秒內未回應，請確認網路連線）'
  );
  if(!res.ok) throw new Error(await jsonbinErrorDetail(res));
  jsonbinCache = obj;
  jsonbinCacheAt = Date.now();
}
async function jsonbinEnsureCache(maxAgeMs){
  if(jsonbinCache && (Date.now()-jsonbinCacheAt) < (maxAgeMs||3000)) return jsonbinCache;
  return await jsonbinFetchLatest();
}
async function initJSONBin(){
  if(USE_CLOUD_STORAGE || USE_FIREBASE || USE_GSHEETS) return; // higher-priority backends win when present
  const cfg = getJSONBinConfig();
  if(!cfg || !cfg.apiKey) return;
  try{
    if(!cfg.binId){
      // first-time setup: create the one bin this app will use, so the person never
      // has to handle a bin ID themselves.
      const res = await withTimeout(
        fetch(JSONBIN_API+'/b', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey, 'X-Bin-Name': 'vis-inspection-db'},
          body: JSON.stringify({_initialized: true})
        }),
        8000,
        '建立資料儲存空間逾時，請確認網路連線與 API Key'
      );
      if(!res.ok) throw new Error(await jsonbinErrorDetail(res));
      const created = await res.json();
      cfg.binId = created.metadata && created.metadata.id;
      if(!cfg.binId) throw new Error('建立資料儲存空間失敗（未取得 bin id）');
      localStorage.setItem(JSONBIN_CONFIG_KEY, JSON.stringify(cfg));
    }
    await jsonbinFetchLatest();
    USE_JSONBIN = true;
    lastJSONBinError = null;
  }catch(e){
    console.error('JSONBin init failed', e);
    USE_JSONBIN = false;
    lastJSONBinError = (e && e.message) || String(e);
  }
}
const Storage = {
  async get(key){
    if(USE_CLOUD_STORAGE) return await window.storage.get(key, true);
    if(USE_FIREBASE){
      const doc = await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).get();
      if(!doc.exists){ throw new Error('key not found: '+key); }
      return {key, value: doc.data().value};
    }
    if(USE_GSHEETS){
      const r = await gsheetsRequest('get', {key});
      if(r.value===undefined || r.value===null){ throw new Error('key not found: '+key); }
      return {key, value: r.value};
    }
    if(USE_JSONBIN){
      const cache = await jsonbinEnsureCache();
      if(!cache.hasOwnProperty(key)){ throw new Error('key not found: '+key); }
      return {key, value: cache[key]};
    }
    const v = localStorage.getItem(key);
    if(v===null){ const e = new Error('key not found: '+key); throw e; }
    return {key, value:v};
  },
  async set(key, value){
    if(USE_CLOUD_STORAGE) return await window.storage.set(key, value, true);
    if(USE_FIREBASE){
      await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).set({value, updatedAt: Date.now()});
      return {key, value};
    }
    if(USE_GSHEETS){
      await gsheetsRequest('set', {key, value});
      return {key, value};
    }
    if(USE_JSONBIN){
      const cache = await jsonbinFetchLatest(); // fresh copy right before writing, to shrink the race window
      cache[key] = value;
      await jsonbinPutAll(cache);
      return {key, value};
    }
    localStorage.setItem(key, value);
    return {key, value};
  },
  async delete(key){
    if(USE_CLOUD_STORAGE) return await window.storage.delete(key, true);
    if(USE_FIREBASE){
      await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).delete();
      return {key, deleted:true};
    }
    if(USE_GSHEETS){
      await gsheetsRequest('delete', {key});
      return {key, deleted:true};
    }
    if(USE_JSONBIN){
      const cache = await jsonbinFetchLatest();
      delete cache[key];
      await jsonbinPutAll(cache);
      return {key, deleted:true};
    }
    localStorage.removeItem(key);
    return {key, deleted:true};
  },
  async list(prefix){
    if(USE_CLOUD_STORAGE) return await window.storage.list(prefix, true);
    if(USE_FIREBASE){
      const col = firestoreDb.collection(FIRESTORE_COLLECTION);
      let snap;
      if(prefix){
        const end = prefix.slice(0,-1) + String.fromCharCode(prefix.charCodeAt(prefix.length-1)+1);
        snap = await col.where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
                         .where(firebase.firestore.FieldPath.documentId(), '<', end).get();
      }else{
        snap = await col.get();
      }
      const keys = [];
      snap.forEach(d=>keys.push(d.id));
      return {keys, prefix};
    }
    if(USE_GSHEETS){
      const r = await gsheetsRequest('list', {prefix: prefix||''});
      return {keys: r.keys||[], prefix};
    }
    if(USE_JSONBIN){
      const cache = await jsonbinEnsureCache();
      const keys = Object.keys(cache).filter(k=>!prefix || k.startsWith(prefix));
      return {keys, prefix};
    }
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && (!prefix || k.startsWith(prefix))) keys.push(k);
    }
    return {keys, prefix};
  }
};
function storageAvailable(){
  return USE_CLOUD_STORAGE || USE_FIREBASE || USE_GSHEETS || USE_JSONBIN || localStorageAvailable();
}
async function withStorageRetry(fn, label){
  if(!storageAvailable()){
    // We only get here if BOTH Claude's cloud storage AND the browser's own localStorage
    // are unavailable — extremely unusual (e.g. private/incognito mode with storage
    // blocked entirely). Retrying won't help, so fail immediately with a clear message.
    lastStorageError = '此瀏覽器目前完全無法儲存資料（雲端與本機儲存皆無法使用）。若使用無痕/隱私瀏覽模式，請改用一般視窗開啟；或確認瀏覽器設定未封鎖網站儲存資料的權限。';
    console.error(label+' skipped — no storage backend is available in this context');
    return false;
  }
  try{
    await fn();
    return true;
  }catch(e1){
    console.warn(label+' failed, retrying once…', e1);
    await new Promise(r=>setTimeout(r, 1100));
    try{
      await fn();
      return true;
    }catch(e2){
      console.error(label+' failed after retry', e2);
      lastStorageError = (e2 && (e2.message || (e2.toString && e2.toString()))) || String(e2);
      return false;
    }
  }
}

// ------------------------------------------------------------------
// STORAGE LAYOUT: everything used to live in ONE key ('vis_db_v1') holding the
// entire database — every account, every brand/model, every setting, AND every
// inspection record (with all its diagram marks/notes) as one giant JSON blob.
// Every single save (even flipping one checkbox in settings) rewrote that whole
// blob. As records piled up this payload kept growing, and on a slower/less
// reliable mobile connection a big payload is far more likely to time out or hit
// a transient server error — which is what "Storage set failed: Internal server
// error" almost certainly was.
//
// Now: small, rarely-changing settings live in META_KEY, and each inspection
// record is its own small key (vis_record_<id>), same pattern as photos. Saving
// one record only ever writes that one small record, not the whole database.
// ------------------------------------------------------------------
const META_KEY = 'vis_meta_v1';
const RECORD_KEY_PREFIX = 'vis_record_';

async function loadDB(){
  const storageOK = storageAvailable();
  try{
    const r = storageOK ? await Storage.get(META_KEY) : null;
    DB = r ? JSON.parse(r.value) : defaultDB();
  }catch(e){
    DB = defaultDB();
  }
  DB._storageUnavailable = !storageOK;
  if(!DB.notePresets) DB.notePresets = defaultDB().notePresets;
  if(!DB.equipment) DB.equipment = JSON.parse(JSON.stringify(DEFAULT_EQUIPMENT));
  if(!DB.funcChecks) DB.funcChecks = DEFAULT_FUNC_CHECKS.slice();
  if(!DB.pdfSettings) DB.pdfSettings = defaultDB().pdfSettings;

  // one-time patch: 電動尾門/天窗 used to be plain "填數量" fields — upgrade them to the
  // new dropdown-option shape in-place for anyone who already has a saved equipment list,
  // without touching any other custom items the admin may have added.
  const SELECT_PATCHES = { powertailgate: ['感應式','手動式','感應+手動'], sunroof: ['1','2','全景'] };
  DB.equipment.forEach(eq=>{
    if(SELECT_PATCHES[eq.key] && !eq.select){
      eq.select = SELECT_PATCHES[eq.key];
      delete eq.qty;
    }
  });

  // FORM TEMPLATES: the app supports designing more than one inspection form layout
  // (different equipment / function-check checklists), so different vehicle types
  // can use different sheets. Older data only ever had one flat DB.equipment /
  // DB.funcChecks list — migrate that into the first ("標準查定表") template once.
  if(!DB.formTemplates || !DB.formTemplates.length){
    DB.formTemplates = [{
      id: 'tpl_default',
      name: '標準查定表',
      equipment: DB.equipment,
      funcChecks: DB.funcChecks
    }];
  }
  // one-time seed: the fully custom "第二份查定表單" — its own diagram images, its own
  // click-symbol set (with its own panel-count rule), and its own equipment/function
  // check lists. Guarded by DB.seededTemplate2 so re-adding it after the admin deletes
  // it doesn't keep reappearing on every load.
  if(!DB.seededTemplate2){
    DB.seededTemplate2 = true;
    DB.formTemplates.push({
      id: 'tpl_v2_full',
      name: '第二份查定表',
      reportStyle: 'v2',
      companyTitle: '高雄冠宥汽車車輛點檢表',
      bodyGradeLabel: '結構評價',
      hasBodyType: true,
      eqColumns: 7,
      fcColumns: 4,
      diagramBody: DIAG_IMG_BODY_2,
      diagramStructure: DIAG_IMG_STRUCT_2,
      diagramSymbols: BODY_SYMBOLS_2,
      panelSymbolsList: Array.from(PANEL_SYMBOLS_2),
      diagramLabelColor: '#1E5FA8',
      diagramLabelFontSize: 25,
      equipment: JSON.parse(JSON.stringify(TEMPLATE2_EQUIPMENT)),
      funcChecks: TEMPLATE2_FUNC_CHECKS.slice()
    });
  }
  // one-time correction pass: earlier seeds of the second template used a placeholder
  // equipment/style set before the real paper form ("高雄冠宥汽車車輛點檢表") was
  // provided — patch an already-seeded template in place so existing databases pick up
  // the corrected content without duplicating or losing any records that reference it.
  if(!DB.migratedTemplate2Style_v2){
    DB.migratedTemplate2Style_v2 = true;
    const t2 = DB.formTemplates.find(t=>t.id==='tpl_v2_full');
    if(t2){
      t2.reportStyle = 'v2';
      t2.companyTitle = '高雄冠宥汽車車輛點檢表';
      t2.diagramLabelColor = '#1E5FA8';
      t2.diagramLabelFontSize = 25;
      t2.hasBodyType = true;
      t2.equipment = JSON.parse(JSON.stringify(TEMPLATE2_EQUIPMENT));
      t2.funcChecks = TEMPLATE2_FUNC_CHECKS.slice();
    }
  }
  // one-time migration: the default account used to be admin/admin — replace it with the
  // requested k1203/1234 account. Guarded so it only runs once and won't re-add k1203 if
  // the admin later renames/removes it themselves.
  if(!DB.migratedDefaultAccount_k1203){
    DB.migratedDefaultAccount_k1203 = true;
    const oldAdmin = DB.accounts.find(a=>a.username==='admin');
    if(oldAdmin && !DB.accounts.find(a=>a.username==='k1203')){
      oldAdmin.username = 'k1203';
      oldAdmin.password = '1234';
    }
  }
  // one-time migration: custom fields used to be one flat list per template, shown in a
  // single fixed "自訂欄位" tab. Now each template can have MULTIPLE named custom tabs —
  // wrap any already-defined flat fields into a single tab so nothing is lost.
  if(!DB.migratedCustomTabs_v1){
    DB.migratedCustomTabs_v1 = true;
    DB.formTemplates.forEach(t=>{
      if(t.customFields && t.customFields.length && !t.customTabs){
        t.customTabs = [{id: uid('ctab'), name:'自訂欄位', fields: t.customFields}];
      }
      if(!t.customTabs) t.customTabs = [];
      delete t.customFields;
    });
  }

  DB.records = [];
  if(storageOK){
    try{
      const listResult = await Storage.list(RECORD_KEY_PREFIX);
      const keys = (listResult && listResult.keys) || [];
      const fetched = await Promise.all(keys.map(async key=>{
        try{
          const r = await Storage.get(key);
          return r ? JSON.parse(r.value) : null;
        }catch(e){ return null; }
      }));
      DB.records = fetched.filter(Boolean);
    }catch(e){
      console.error('loading records failed', e);
    }
  }

  // one-time migration: an older version of this app kept everything (including
  // records) under STORAGE_KEY. If that old blob still exists and we don't have
  // any per-record keys yet, pull the old records/settings across automatically
  // so nothing already saved gets lost.
  if(storageOK && DB.records.length === 0){
    try{
      const legacy = await Storage.get('vis_db_v1');
      if(legacy){
        const legacyDB = JSON.parse(legacy.value);
        if(Array.isArray(legacyDB.records) && legacyDB.records.length){
          DB.records = legacyDB.records;
          await Promise.all(DB.records.map(rec=>saveRecordToStorage(rec)));
        }
        ['accounts','brands','notePresets','equipment','funcChecks','pdfSettings','dispatch','seq','formTemplates'].forEach(k=>{
          if(legacyDB[k] !== undefined) DB[k] = legacyDB[k];
        });
        await saveDB();
      }
    }catch(e){ /* no legacy data, nothing to migrate */ }
  }
}

async function saveDB(){
  // saves only the small settings/config bundle — NEVER the records array.
  const { records, ...meta } = DB;
  const payload = JSON.stringify(meta);
  return await withStorageRetry(
    ()=>Storage.set(META_KEY, payload),
    'saveDB'
  );
}
async function saveRecordToStorage(record){
  const payload = JSON.stringify(record);
  return await withStorageRetry(
    ()=>Storage.set(RECORD_KEY_PREFIX+record.id, payload),
    'saveRecord#'+record.id
  );
}
async function deleteRecordFromStorage(id){
  return await withStorageRetry(
    ()=>Storage.delete(RECORD_KEY_PREFIX+id),
    'deleteRecord#'+id
  );
}
// Photos are stored ONE PER KEY (vis_photo_<recordId>_<index>) rather than one big
// array under a single key. 60-70 photos in a single value can exceed the 5MB per-key
// storage limit (this was the cause of "Storage set failed" errors on mobile, where
// people actually filled most of the photo slots). Per-slot keys keep each write small
// and let each photo save/fail independently.
// Run many async jobs with a small concurrency cap instead of firing them all at
// once. Photos can have up to 65 slots — blasting 65+ simultaneous storage requests
// (which the old Promise.all-based code did) is very likely what was tipping the
// storage backend into "Internal server error while processing action", especially
// on mobile where people actually fill most of the photo slots. A cap of 3 keeps
// throughput reasonable without hammering the backend.
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let cursor = 0;
  async function worker(){
    while(cursor < items.length){
      const current = cursor++;
      try{ results[current] = await fn(items[current], current); }
      catch(e){ results[current] = undefined; }
    }
  }
  const workers = Array.from({length: Math.max(1, Math.min(limit, items.length))}, worker);
  await Promise.all(workers);
  return results;
}
async function getPhotos(recordId){
  const photos = new Array(65).fill(null);
  try{
    const listResult = await Storage.list('vis_photo_'+recordId+'_');
    const keys = (listResult && listResult.keys) || [];
    await mapWithConcurrency(keys, 3, async (key)=>{
      const idx = parseInt(key.split('_').pop(), 10);
      if(isNaN(idx) || idx<0 || idx>=photos.length) return;
      try{
        const r = await Storage.get(key);
        if(r) photos[idx] = r.value;
      }catch(e){}
    });
  }catch(e){}
  return photos;
}
async function savePhotoSlot(recordId, index, dataUrl){
  const key = 'vis_photo_'+recordId+'_'+index;
  const ok = await withStorageRetry(
    ()=> dataUrl ? Storage.set(key, dataUrl) : Storage.delete(key),
    'savePhotoSlot#'+index
  );
  if(!ok){
    toast('第 '+(index+1)+' 張照片儲存失敗，請確認網路連線後再試一次');
  }
  return ok;
}
async function deleteAllPhotos(recordId){
  try{
    const listResult = await Storage.list('vis_photo_'+recordId+'_');
    const keys = (listResult && listResult.keys) || [];
    await mapWithConcurrency(keys, 3, (k)=> Storage.delete(k).catch(()=>{}));
  }catch(e){}
}

function toast(msg, durationMs){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.add('hidden'), durationMs || 2200);
}
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

let currentUser = null;

async function doLogin(){
  if(!DB){
    document.getElementById('loginErr').textContent = '系統仍在載入中，請稍候幾秒再試一次';
    return;
  }
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const acc = DB.accounts.find(a=>a.username===u);
  if(!acc){ err.textContent = '查無此帳號'; return; }
  if(!acc.active){ err.textContent = '此帳號已停用，請聯繫管理員'; return; }
  if(acc.password !== p){ err.textContent = '密碼錯誤'; return; }
  err.textContent = '';
  currentUser = acc;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoami').textContent = acc.name + '（' + (acc.role==='admin'?'管理員':'查定師') + '）';
  buildNav();
  if(isMobileViewport()) document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('storageWarning').classList.toggle('hidden', !DB._storageUnavailable);
  document.getElementById('localModeNotice').classList.toggle('hidden', USE_CLOUD_STORAGE || USE_FIREBASE || USE_GSHEETS || USE_JSONBIN || DB._storageUnavailable);
  goto('dashboard');
}
function logout(){
  currentUser = null;

  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}

  currentRoute = key;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.key===key));

function renderDashboard(){

  const thisMonth = thisMonthRecords.length;
  const pendingDispatch = DB.dispatch.filter(d=>d.status!=='done').length;

  // per-inspector breakdown for the current month, sorted highest first
  const byInspector = {};
  thisMonthRecords.forEach(r=>{

    byInspector[name] = (byInspector[name]||0) + 1;
  });
  const inspectorRows = Object.entries(byInspector).sort((a,b)=>b[1]-a[1]);
  const maxCount = inspectorRows.length ? inspectorRows[0][1] : 0;

  const html = `
  <div class="grid3">

  </div>

    <h3>本月各查定師完成件數</h3>
    ${inspectorRows.length ? `
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${inspectorRows.map(([name,count])=>`
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:110px;font-size:13px;font-weight:600;flex-shrink:0;">${name}</div>
          <div style="flex:1;background:var(--surface-alt);border-radius:3px;overflow:hidden;height:18px;">
            <div style="width:${maxCount?Math.round(count/maxCount*100):0}%;background:var(--blue);height:100%;"></div>
          </div>
          <div style="width:30px;text-align:right;font-family:var(--mono);font-weight:700;">${count}</div>
        </div>`).join('')}

  </div>
  <div class="panel">
    <h3>最近查定紀錄</h3>
    <table><thead><tr><th>車牌</th><th>廠牌／車型</th><th>查定師</th><th>日期</th></tr></thead>

    </tbody></table>
  </div>`;
  document.getElementById('mainContent').innerHTML = html;

function addBrandPrompt(){
  const name = prompt('請輸入新廠牌名稱（例如 PORSCHE）');
  if(!name) return;
  const key = name.trim().toUpperCase();
  if(!key) return;
  if(!DB.brands[key]) DB.brands[key] = [];
  saveDB(); renderBrands(); toast('已新增廠牌 '+key);
}
function renameBrand(oldName){
  const name = prompt('修改廠牌名稱', oldName);
  if(!name) return;
  const newKey = name.trim().toUpperCase();
  if(!newKey || newKey===oldName) return;
  if(DB.brands[newKey]){ toast('已存在同名廠牌'); return; }
  DB.brands[newKey] = DB.brands[oldName];
  delete DB.brands[oldName];
  saveDB(); renderBrands(); toast('已更新廠牌名稱');
}
function addModelPrompt(brand){
  const name = prompt('請輸入 '+brand+' 的新車型名稱');
  if(!name) return;
  const key = name.trim().toUpperCase();
  if(!key) return;
  if(!DB.brands[brand].includes(key)) DB.brands[brand].push(key);
  saveDB(); renderBrands(); toast('已新增車型 '+key);
}
function renameModel(brand, oldModel){
  const name = prompt('修改車型名稱', oldModel);
  if(!name) return;
  const newKey = name.trim().toUpperCase();
  if(!newKey || newKey===oldModel) return;
  if(DB.brands[brand].includes(newKey)){ toast('已存在同名車型'); return; }
  const idx = DB.brands[brand].indexOf(oldModel);
  if(idx>=0) DB.brands[brand][idx] = newKey;
  saveDB(); renderBrands(); toast('已更新車型名稱');
}
function deleteBrand(brand){
  if(!confirm('確定刪除廠牌「'+brand+'」及其所有車型？')) return;
  delete DB.brands[brand]; saveDB(); renderBrands();
}
function deleteModel(brand, model){
  DB.brands[brand] = DB.brands[brand].filter(m=>m!==model);
  saveDB(); renderBrands();
}

function moveArrayItem(arr, from, to){

  arr.splice(to,0,item);
}

function addEquipmentItem(){
  const label = prompt('請輸入配備項目名稱');
  if(!label) return;
  const mode = confirm('此項目是否需要下拉選單／填寫數量？（確定＝需要／取消＝單純勾選）');
  const t = currentSettingsTemplate();
  if(mode){
    const optionsRaw = prompt('若需要下拉選單，請輸入選項並用逗號分隔（例如：感應式,手動式,感應+手動）；若只是填寫數量，留空即可');
    if(optionsRaw && optionsRaw.trim()){
      t.equipment.push({key:uid('eq'), label:label.trim(), select: optionsRaw.split(',').map(s=>s.trim()).filter(Boolean)});
    }else{
      t.equipment.push({key:uid('eq'), label:label.trim(), qty:true});
    }
  }else{
    t.equipment.push({key:uid('eq'), label:label.trim()});
  }
  saveDB(); renderEqSettings(); toast('已新增配備項目');
}
function editEquipmentItem(i){
  const t = currentSettingsTemplate();
  const eq = t.equipment[i];
  const newLabel = prompt('修改配備項目名稱', eq.label);
  if(!newLabel) return;
  eq.label = newLabel.trim();
  const mode = confirm('是否需要下拉選單／填寫數量？（確定＝需要／取消＝單純勾選）\n（目前：'+(eq.select?'下拉選單':(eq.qty?'可填數量':'單純勾選'))+'）');
  if(mode){
    const optionsRaw = prompt('若需要下拉選單，請輸入選項並用逗號分隔；若只是填寫數量，留空即可', eq.select ? eq.select.join(',') : '');
    delete eq.select; delete eq.qty;
    if(optionsRaw && optionsRaw.trim()){
      eq.select = optionsRaw.split(',').map(s=>s.trim()).filter(Boolean);
    }else{
      eq.qty = true;
    }
  }else{
    delete eq.select; delete eq.qty;
  }
  saveDB(); renderEqSettings(); toast('已更新配備項目');
}
function removeEquipmentItem(i){

let settingsCustomTabId = null; // which custom tab is currently being edited
function renderCustomFieldSettings(){
  const t = currentSettingsTemplate();
  if(!t.customTabs) t.customTabs = [];
  if(t.customTabs.length && (!settingsCustomTabId || !t.customTabs.find(x=>x.id===settingsCustomTabId))){
    settingsCustomTabId = t.customTabs[0].id;
  }
  const wrap = document.getElementById('cfTabsWrap');
  if(wrap){
    wrap.innerHTML = t.customTabs.map(tab=>`
      <span class="chip ${tab.id===settingsCustomTabId?'on':''}" onclick="switchSettingsCustomTab('${tab.id}')">${tab.name}</span>
    `).join('') || '<span style="color:var(--ink-soft);font-size:12px;">尚未新增任何標籤</span>';
  }
  const tabActions = document.getElementById('cfTabActions');
  const currentTab = t.customTabs.find(x=>x.id===settingsCustomTabId);
  if(tabActions) tabActions.style.display = currentTab ? '' : 'none';
  const body = document.getElementById('cfSettingsBody');
  if(!body) return;
  if(!currentTab){
    body.innerHTML = '<tr><td colspan="3" style="color:var(--ink-soft);">請先新增一個標籤</td></tr>';
    return;
  }
  body.innerHTML = currentTab.fields.map((f,i)=>`
    <tr>
      <td data-label="欄位名稱">${f.label}</td>
      <td data-label="類型">${f.type==='select' ? '下拉選單（'+(f.options||[]).join('／')+'）' : '文字輸入'}</td>

        <button class="btn btn-danger btn-sm" onclick="removeCustomField(${i})">刪除</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="3" style="color:var(--ink-soft);">此標籤尚無欄位</td></tr>';
}
function switchSettingsCustomTab(id){
  settingsCustomTabId = id;

}
function addCustomTab(){
  const name = prompt('請輸入新標籤名稱（例如：保養紀錄、驗車資訊…）');
  if(!name) return;
  const t = currentSettingsTemplate();
  if(!t.customTabs) t.customTabs = [];
  const newTab = {id:uid('ctab'), name:name.trim(), fields:[]};
  t.customTabs.push(newTab);
  settingsCustomTabId = newTab.id;
  saveDB(); renderCustomFieldSettings(); toast('已新增標籤：'+newTab.name);
}
function renameCustomTab(){
  const t = currentSettingsTemplate();
  const tab = t.customTabs.find(x=>x.id===settingsCustomTabId);
  if(!tab) return;
  const name = prompt('重新命名標籤', tab.name);
  if(!name) return;
  tab.name = name.trim();
  saveDB(); renderCustomFieldSettings(); toast('已更新標籤名稱');
}
function deleteCustomTab(){
  const t = currentSettingsTemplate();
  const tab = t.customTabs.find(x=>x.id===settingsCustomTabId);
  if(!tab) return;
  if(!confirm('確定刪除標籤「'+tab.name+'」？此標籤內所有欄位設定將一併刪除。')) return;
  t.customTabs = t.customTabs.filter(x=>x.id!==tab.id);
  settingsCustomTabId = null;

}
function addCustomField(){
  const t = currentSettingsTemplate();
  const tab = t.customTabs.find(x=>x.id===settingsCustomTabId);
  if(!tab){ toast('請先新增一個標籤'); return; }
  const label = prompt('請輸入自訂欄位名稱（例如：驗車到期日、里程保證書編號…）');
  if(!label) return;
  const isSelect = confirm('這個欄位要用下拉選單嗎？（確定＝下拉選單／取消＝一般文字輸入）');
  if(isSelect){
    const optionsRaw = prompt('請輸入選項，用逗號分隔（例如：是,否）');
    const options = (optionsRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(options.length===0){ toast('未輸入選項，已改為一般文字輸入'); tab.fields.push({id:uid('cf'), label:label.trim(), type:'text'}); }
    else tab.fields.push({id:uid('cf'), label:label.trim(), type:'select', options});
  }else{
    tab.fields.push({id:uid('cf'), label:label.trim(), type:'text'});
  }
  saveDB(); renderCustomFieldSettings(); toast('已新增自訂欄位');
}
function removeCustomField(i){
  if(!confirm('確定刪除此自訂欄位？已填寫的資料將不再顯示。')) return;
  const t = currentSettingsTemplate();
  const tab = t.customTabs.find(x=>x.id===settingsCustomTabId);
  if(!tab) return;
  tab.fields.splice(i,1); saveDB(); renderCustomFieldSettings();
}
function editCustomField(i){
  const t = currentSettingsTemplate();
  const tab = t.customTabs.find(x=>x.id===settingsCustomTabId);
  if(!tab) return;
  const f = tab.fields[i];
  const newLabel = prompt('修改自訂欄位名稱', f.label);
  if(!newLabel) return;
  f.label = newLabel.trim();
  const isSelect = confirm('這個欄位要用下拉選單嗎？（確定＝下拉選單／取消＝一般文字輸入）\n（目前：'+(f.type==='select'?'下拉選單':'一般文字輸入')+'）');
  if(isSelect){
    const optionsRaw = prompt('請輸入選項，用逗號分隔（例如：是,否）', f.options ? f.options.join(',') : '');
    const options = (optionsRaw||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(options.length===0){ toast('未輸入選項，已改為一般文字輸入'); f.type='text'; delete f.options; }
    else{ f.type='select'; f.options=options; }
  }else{
    f.type='text'; delete f.options;
  }
  saveDB(); renderCustomFieldSettings(); toast('已更新自訂欄位');
}

    <pre style="background:#171B2E;color:#e8e8e8;padding:12px;border-radius:4px;font-size:10.5px;overflow:auto;max-height:280px;">function doGet(e) {
  return out({ok: true, note: '這個網頁應用程式已在線上運作，請在系統的「雲端同步設定」頁面填入這個網址進行連線，不需要在這裡直接開啟。'});
}
function doPost(e) {
  // If this shows an error at "e.postData.contents", it almost always means the
  // function was run directly from the Apps Script editor's "執行/Run" button —
  // e is only provided when a real web request comes in through the deployed
  // Web App URL. Don't use "執行" to test this; deploy it and let the system connect
  // to the deployed URL instead. This guard turns that mistake into a clear message.
  if (!e || !e.postData || !e.postData.contents) {
    return out({error: '沒有收到請求資料。這個函式必須透過已部署的「網頁應用程式」網址呼叫，不能在編輯器按「執行」直接測試——請改成部署後，在系統的「雲端同步設定」頁面填入網址測試連線。'});
  }
  var lock = LockService.getScriptLock();
  lock.waitLock(15000);
  try {
    var body = JSON.parse(e.postData.contents);
    var TOKEN = '請改成你自己設定的密語'; // 跟系統裡填的 token 要一致
    if (body.token !== TOKEN) return out({error: 'unauthorized'});

    var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('kv') 
      || SpreadsheetApp.getActiveSpreadsheet().insertSheet('kv');
    var data = sheet.getDataRange().getValues();
    var action = body.action;

    if (action === 'get') {
      for (var i = 0; i < data.length; i++) {
        if (data[i][0] === body.key) return out({value: data[i][1]});
      }
      return out({value: null});
    }
    if (action === 'set') {
      for (var i = 0; i < data.length; i++) {
        if (data[i][0] === body.key) {
          sheet.getRange(i + 1, 2).setValue(body.value);
          return out({ok: true});
        }
      }
      sheet.appendRow([body.key, body.value]);
      return out({ok: true});
    }
    if (action === 'delete') {
      for (var i = 0; i < data.length; i++) {
        if (data[i][0] === body.key) { sheet.deleteRow(i + 1); break; }
      }
      return out({ok: true});
    }
    if (action === 'list') {
      var keys = [];
      var prefix = body.prefix || '';
      for (var i = 0; i < data.length; i++) {
        if (data[i][0] && String(data[i][0]).indexOf(prefix) === 0) keys.push(data[i][0]);
      }
      return out({keys: keys});
    }
    return out({error: 'unknown action'});
  } finally {
    lock.releaseLock();
  }
}
function out(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);

async function saveFirebaseConfigAndReload(){

    authDomain: document.getElementById('fb_authDomain').value.trim(),
    projectId: document.getElementById('fb_projectId').value.trim(),

  USE_FIREBASE = false; firestoreDb = null;

  await initFirebase();

    setTimeout(()=>location.reload(), 800);
  }else{
    const err = lastFirebaseError || '未知錯誤';
    let hint = '';
    if(/permission-denied/i.test(err)) hint = '→ 這通常代表 Firestore 的「安全性規則」還沒開放讀寫，請到 Firebase 主控台 Firestore Database → Rules，改成本頁下方提供的規則範例。';
    else if(/not[- ]found|NOT_FOUND/i.test(err) || /database.*does not exist/i.test(err)) hint = '→ 這通常代表這個專案裡「還沒建立 Firestore 資料庫」。請到 Firebase 主控台左側選單「Firestore Database」→「建立資料庫」（不是 Realtime Database）。';
    else if(/api[- ]?key/i.test(err)) hint = '→ 請確認 apiKey 是否完整複製，沒有多餘的空白或缺字。';
    else hint = '→ 請確認網路連線、以及各欄位是否完整複製自 Firebase 主控台的設定內容。';
    msg.innerHTML = '❌ 連線失敗：<span class="mono">'+err+'</span><br>'+hint;
    msg.style.color = 'var(--danger)';

function exportBackup(){
  const { records, ...meta } = DB;
  const backup = {
    exportedAt: new Date().toISOString(),
    version: 1,
    meta,
    records
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = '查定系統備份_'+dateStr+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('備份檔已下載');
}
async function importBackup(event){
  const file = event.target.files[0];
  event.target.value = ''; // allow re-selecting the same file later
  if(!file) return;
  const msg = document.getElementById('backupMsg');
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || !backup.meta || !Array.isArray(backup.records)){
      msg.textContent = '❌ 檔案格式不正確，不是本系統匯出的備份檔';
      msg.style.color = 'var(--danger)';
      return;
    }
    const recordCount = backup.records.length;
    const exportedAt = backup.exportedAt ? new Date(backup.exportedAt).toLocaleString() : '未知時間';
    if(!confirm('即將還原備份檔（匯出時間：'+exportedAt+'，共 '+recordCount+' 筆查定紀錄）。\n\n這會覆蓋目前的帳號、廠牌車型、查定表單設定，並新增/覆蓋備份中的查定紀錄。確定要繼續嗎？')) return;

    msg.textContent = '還原中，請稍候…'; msg.style.color = 'var(--ink-soft)';

    // restore settings/meta
    DB = { ...backup.meta, records: DB.records };
    const metaOk = await saveDB();
    if(!metaOk){
      msg.textContent = '❌ 設定資料還原失敗：'+(lastStorageError||'請確認網路連線');
      msg.style.color = 'var(--danger)';
      return;
    }

    // restore records one by one (each has its own storage key)
    let failCount = 0;
    for(const rec of backup.records){
      const ok = await saveRecordToStorage(rec);
      if(!ok) failCount++;
    }
    DB.records = backup.records;

    if(failCount>0){
      msg.textContent = '⚠️ 還原完成，但有 '+failCount+' 筆查定紀錄寫入失敗（'+(lastStorageError||'')+'），請重新整理頁面後再試一次匯入';
      msg.style.color = 'var(--stamp)';
    }else{
      msg.textContent = '✅ 還原完成，共 '+recordCount+' 筆查定紀錄，即將重新整理頁面…';
      msg.style.color = 'var(--ok)';
      setTimeout(()=>location.reload(), 1200);
    }
  }catch(e){
    console.error('import backup failed', e);
    msg.textContent = '❌ 還原失敗：'+(e.message||String(e));
    msg.style.color = 'var(--danger)';
  }
}

function renderAccounts(){

          <tr>
            <td class="mono" data-label="帳號">${a.username}</td>
            <td data-label="姓名">${a.name}</td>
            <td data-label="權限">${a.role==='admin'?'管理員':'查定師'}</td>

              <button class="btn btn-sm ${a.active?'btn-danger':'btn-blue'}" onclick="toggleAccountActive('${a.id}')">${a.active?'停用':'啟用'}</button>
            </td>
          </tr>`).join('')}
      </tbody>

  </div>`;
  document.getElementById('mainContent').innerHTML = html;
}
function toggleAccountActive(id){
  const a = DB.accounts.find(x=>x.id===id);
  if(a.username==='admin'){ toast('admin 帳號無法停用'); return; }
  a.active = !a.active; saveDB(); renderAccounts();
}
function openAccountModal(id){
  const acc = id ? DB.accounts.find(a=>a.id===id) : null;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>${acc?'編輯帳號':'新增帳號'}</h3>
      <div class="field"><label>帳號</label><input id="mUser" value="${acc?acc.username:''}" ${acc?'disabled':''}></div>
      <div class="field"><label>姓名</label><input id="mName" value="${acc?acc.name:''}"></div>
      ${!acc?'<div class="field"><label>密碼</label><input id="mPass" type="password"></div>':''}
      <div class="field"><label>權限</label>
        <select id="mRole">
          <option value="inspector" ${acc&&acc.role==='inspector'?'selected':''}>查定師</option>
          <option value="admin" ${acc&&acc.role==='admin'?'selected':''}>管理員</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-stamp" onclick="saveAccount('${acc?acc.id:''}')">儲存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}
function saveAccount(id){
  const name = document.getElementById('mName').value.trim();
  const role = document.getElementById('mRole').value;
  if(!name){ toast('請輸入姓名'); return; }
  if(id){
    const a = DB.accounts.find(x=>x.id===id);
    a.name = name; a.role = role;
  }else{
    const username = document.getElementById('mUser').value.trim();
    const pass = document.getElementById('mPass').value;
    if(!username || !pass){ toast('請輸入帳號與密碼'); return; }
    if(DB.accounts.find(a=>a.username===username)){ toast('此帳號已存在'); return; }
    DB.accounts.push({id:uid('u'), username, password:pass, name, role, active:true});
  }
  saveDB(); document.querySelector('.modal-overlay').remove(); renderAccounts(); toast('已儲存');
}
function openPwdModal(id){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

    <div class="modal-box" style="max-width:360px;">
      <h3>修改密碼</h3>

      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-stamp" onclick="savePwd('${id}')">儲存</button>
      </div>
    </div>`;

async function savePwd(id){
  const p = document.getElementById('mNewPass').value;
  if(!p){ toast('請輸入新密碼'); return; }
  const acc = DB.accounts.find(a=>a.id===id);
  const old = acc.password;
  acc.password = p;
  const ok = await saveDB();
  if(ok){
    document.querySelector('.modal-overlay').remove();
    toast('密碼已更新');
  }else{
    acc.password = old; // don't leave local state out of sync with what's actually persisted

async function saveMyPwd(){
  const oldPass = document.getElementById('myOldPass').value;
  const newPass = document.getElementById('myNewPass').value;
  const newPass2 = document.getElementById('myNewPass2').value;
  if(currentUser.password !== oldPass){ toast('目前密碼輸入錯誤'); return; }
  if(!newPass){ toast('請輸入新密碼'); return; }
  if(newPass !== newPass2){ toast('兩次輸入的新密碼不一致'); return; }
  const acc = DB.accounts.find(a=>a.id===currentUser.id);
  const old = acc.password;
  acc.password = newPass;
  const ok = await saveDB();
  if(ok){
    currentUser.password = newPass;
    document.querySelector('.modal-overlay').remove();
    toast('密碼已更新');
  }else{
    acc.password = old;
    toast('儲存失敗：'+(lastStorageError||'請確認網路連線')+'，請再試一次', 5000);
  }
}

function switchTab(id){
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active', p.id===id));
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
}

function onBrandChange(preselectModel){
  const brand = document.getElementById('f_brand').value;
  const modelSel = document.getElementById('f_model');
  const models = (DB.brands[brand]||[]).slice().sort((a,b)=>a.localeCompare(b));
  modelSel.innerHTML = '<option value="">請選擇</option>' + models.map(m=>`<option value="${m}" ${preselectModel===m?'selected':''}>${m}</option>`).join('');
}

function onTemplateChange(){
  const newId = document.getElementById('f_template').value;
  activeTemplate = getTemplateById(newId);
  formRecord.templateId = activeTemplate.id;
  // different templates have different equipment/checklist items, so the previous
  // selections don't carry over cleanly — start fresh for the newly chosen template.
  formRecord.equipment = {};
  formRecord.functionChecks = {};
  formRecord.customFields = {};
  buildEquipmentGrid();
  buildFuncGrid();
  buildCustomTabs();
  // 車身形式 only applies to templates that call for it (e.g. the 點檢表 template)
  const bodyTypeField = document.getElementById('bodyTypeField');
  if(bodyTypeField){
    bodyTypeField.style.display = activeTemplate.hasBodyType ? '' : 'none';
    if(!activeTemplate.hasBodyType){ document.getElementById('f_bodyType').value = ''; formRecord.bodyType = ''; }
  }
  // templates can also have their own diagram images / click-symbol set / label style
  document.querySelector('#bodyDiagramWrap .diagram-bg').src = activeTemplate.diagramBody;
  document.querySelector('#structDiagramWrap .diagram-bg').src = activeTemplate.diagramStructure;
  buildSymbolToolbar('symToolbarBody','bodyDiagramWrap');
  buildSymbolToolbar('symToolbarStruct','structDiagramWrap');
  renderMarks('bodyDiagramWrap','bodyMarks');
  renderMarks('structDiagramWrap','structureMarks');
  recalcPanelCount();
  toast('已切換查定表單：'+activeTemplate.name);
}

function buildSymbolToolbar(toolbarId, wrapId){
  // The toolbar row is no longer used for placing marks (see attachDiagramClicks) —
  // tapping the diagram now opens a popup right at that spot instead, which is far
  // more direct than pre-selecting a symbol from a separate row above and then
  // clicking blindly on the image. Left in place (empty) only so nothing else that
  // references these container ids breaks.
  const bar = document.getElementById(toolbarId);
  if(bar) bar.innerHTML = '';
}
function closeSymbolPopup(){
  document.querySelectorAll('.diag-symbol-popup').forEach(p=>p.remove());
}
function openSymbolPopup(wrap, wrapId, markField, xPct, yPct, pxX, pxY){
  closeSymbolPopup();
  const popup = document.createElement('div');
  popup.className = 'diag-symbol-popup';
  popup.style.left = pxX + 'px';
  popup.style.top = pxY + 'px';
  let selected = [];
  function render(){
    popup.innerHTML =
      `<div class="popup-hint">點選符號（可複選），再按放置</div>
       <div class="popup-syms">${activeTemplate.diagramSymbols.map(s=>`<button type="button" class="sym-btn ${selected.includes(s)?'active':''}" data-sym="${s}">${s}</button>`).join('')}</div>
       <div class="popup-actions">
         <button type="button" class="btn btn-stamp btn-sm" id="popupPlaceBtn">放置</button>
         <button type="button" class="btn btn-ghost btn-sm" id="popupCancelBtn">取消</button>
       </div>`;
    popup.querySelectorAll('.sym-btn').forEach(btn=>{
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        const s = btn.dataset.sym;
        const idx = selected.indexOf(s);
        if(idx>=0) selected.splice(idx,1); else selected.push(s);
        render();
      };
    });
    popup.querySelector('#popupPlaceBtn').onclick = (ev)=>{
      ev.stopPropagation();
      if(selected.length===0){ toast('請至少選擇一個符號'); return; }
      formRecord[markField].push({id:uid('mk'), x:xPct, y:yPct, text:selected.join('')});
      renderMarks(wrapId, markField);
      recalcPanelCount();
      closeSymbolPopup();
    };
    popup.querySelector('#popupCancelBtn').onclick = (ev)=>{ ev.stopPropagation(); closeSymbolPopup(); };
  }
  render();
  wrap.appendChild(popup);
  // keep the popup on-screen if it would otherwise overflow the diagram box
  requestAnimationFrame(()=>{
    const wrapRect = wrap.getBoundingClientRect();
    const popRect = popup.getBoundingClientRect();
    if(popRect.right > wrapRect.right) popup.style.left = Math.max(4, pxX - popRect.width) + 'px';
    if(popRect.bottom > wrapRect.bottom) popup.style.top = Math.max(4, pxY - popRect.height) + 'px';
  });
}
function attachDiagramClicks(wrapId, markField){
  const wrap = document.getElementById(wrapId);
  wrap.addEventListener('click', (e)=>{
    if(e.target.closest('.diag-label')) return; // clicking an existing label should not place a new mark
    if(e.target.closest('.diag-symbol-popup')) return; // clicks inside the popup are handled by the popup itself
    closeSymbolPopup();
    const rect = wrap.getBoundingClientRect();
    const pxX = e.clientX - rect.left, pxY = e.clientY - rect.top;
    const xPct = (pxX / rect.width) * 100;
    const yPct = (pxY / rect.height) * 100;
    openSymbolPopup(wrap, wrapId, markField, xPct, yPct, pxX, pxY);
  });
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.diag-symbol-popup') && !e.target.closest('.diagram-wrap')) closeSymbolPopup();
});
function renderMarks(wrapId, markField){
  const wrap = document.getElementById(wrapId);
  wrap.querySelectorAll('.diag-label').forEach(n=>n.remove());
  formRecord[markField].forEach(mark=>{
    const isYellow = (markField==='structureMarks' && mark.text.includes('X'));
    const div = document.createElement('div');
    div.className = 'diag-label' + (isYellow?' yellow-x':'');
    div.style.left = mark.x + '%';
    div.style.top = mark.y + '%';
    div.style.color = activeTemplate.diagramLabelColor;
    div.style.fontSize = activeTemplate.diagramLabelFontSize + 'px';
    div.textContent = mark.text;
    div.dataset.id = mark.id;
    const delX = document.createElement('span');
    delX.className = 'del-x'; delX.textContent = '×';
    delX.onclick = (ev)=>{ ev.stopPropagation(); removeMark(wrapId, markField, mark.id); };
    div.appendChild(delX);
    makeDraggable(div, wrap, wrapId, markField, mark.id);
    wrap.appendChild(div);
  });
}
function removeMark(wrapId, markField, id){
  formRecord[markField] = formRecord[markField].filter(m=>m.id!==id);
  renderMarks(wrapId, markField);
  recalcPanelCount();
}
function makeDraggable(el, wrap, wrapId, markField, id){
  let dragging = false;
  el.addEventListener('mousedown', (e)=>{
    if(e.target.classList.contains('del-x')) return;
    dragging = true; e.preventDefault();
  });
  document.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    const rect = wrap.getBoundingClientRect();
    let xPct = ((e.clientX - rect.left) / rect.width) * 100;
    let yPct = ((e.clientY - rect.top) / rect.height) * 100;
    xPct = Math.max(0,Math.min(100,xPct)); yPct = Math.max(0,Math.min(100,yPct));
    el.style.left = xPct+'%'; el.style.top = yPct+'%';
    const mark = formRecord[markField].find(m=>m.id===id);
    if(mark){ mark.x = xPct; mark.y = yPct; }
  });
  document.addEventListener('mouseup', ()=>{ dragging=false; });
}
function recalcPanelCount(){
  let count = 0;
  formRecord.bodyMarks.forEach(m=>{
    for(const ch of activeTemplate.panelSymbolsList){ if(m.text.includes(ch)) count++; }
  });
  const el = document.getElementById('f_panelCount');
  if(el) el.value = count;
  formRecord.panelCount = count;
}
