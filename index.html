<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車輛查定管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17212b;--ink2:#46535f;--mute:#77838f;--paper:#f2f4f3;--card:#fff;--line:#d6dcdf;--acc:#0b5d6b;--acc2:#084a56;--accbg:#e1f0f2;--warn:#a85f00;--warnbg:#fff2dc;--bad:#b3261e;--badbg:#fdeceb;--ok:#1d7a44;--okbg:#e4f4ea;--side:#131d27;--sidetx:#c5d0d9;--r:8px;--sh:0 1px 2px rgba(20,30,40,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6ecf0;--ink2:#b3bec7;--mute:#8894a0;--paper:#0f161d;--card:#18222c;--line:#2d3a46;--acc:#4fb6c6;--acc2:#7fd0dc;--accbg:#12323a;--warn:#f0b35a;--warnbg:#3a2c12;--bad:#ff8d85;--badbg:#3a1a18;--ok:#6ed19a;--okbg:#14301f;--side:#0a1117}}
:root[data-theme="dark"]{--ink:#e6ecf0;--ink2:#b3bec7;--mute:#8894a0;--paper:#0f161d;--card:#18222c;--line:#2d3a46;--acc:#4fb6c6;--acc2:#7fd0dc;--accbg:#12323a;--warn:#f0b35a;--warnbg:#3a2c12;--bad:#ff8d85;--badbg:#3a1a18;--ok:#6ed19a;--okbg:#14301f;--side:#0a1117}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{min-height:100%}
.hide{display:none!important}
.mut{color:var(--mute)}.sm{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc2)}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.btn.s{min-height:36px;padding:0 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.8rem;background:var(--accbg);color:var(--acc);font-weight:500}
.pill.w{background:var(--warnbg);color:var(--warn)}.pill.g{background:var(--okbg);color:var(--ok)}.pill.r{background:var(--badbg);color:var(--bad)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink2);font-weight:500}
label.f>input,label.f>select,label.f>textarea,.inp{min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:1rem;color:var(--ink);width:100%}
textarea.inp,label.f>textarea{min-height:96px;resize:vertical}
.g{display:grid;gap:12px}
.g.basic{grid-template-columns:repeat(2,1fr)}
.g.c2{grid-template-columns:repeat(2,1fr)}
.g.eq{grid-template-columns:repeat(2,1fr);gap:8px}
.g.fn{grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.g.basic{grid-template-columns:repeat(3,1fr)}.g.eq{grid-template-columns:repeat(4,1fr)}.g.fn{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.g.basic{grid-template-columns:repeat(4,1fr)}.g.eq{grid-template-columns:repeat(7,1fr)}.g.fn{grid-template-columns:repeat(4,1fr)}}
.tick{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;flex-wrap:wrap}
.tick input[type=checkbox],.tick input[type=radio]{width:20px;height:20px;accent-color:var(--acc);flex:none}
.tick.on{border-color:var(--acc);background:var(--accbg)}
.tick .ex{width:64px;min-height:32px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.sym{font:700 1.15rem Arial,sans-serif;min-width:50px;border-radius:var(--r);padding:0 10px}
/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sidetx);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px;color:#fff;font-weight:700}
.brand b{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--acc);color:#fff;font-size:1rem}
.side a.nv{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;color:var(--sidetx);text-decoration:none;cursor:pointer;min-height:44px}
.side a.nv:hover{background:rgba(255,255,255,.07)}
.side a.nv.on{background:var(--acc);color:#fff}
.side .grp{font-size:.75rem;color:#7d8d9a;padding:14px 10px 4px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.content{padding:16px;max-width:1280px;width:100%;margin:0 auto;flex:1;padding-bottom:96px}
.menubtn{display:none}
.bnav{display:none}
@media(max-width:899px){
.shell{grid-template-columns:1fr}
.side{position:fixed;inset:0 25% 0 0;z-index:60;height:100%;transform:translateX(-105%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.side.open{transform:none}
.menubtn{display:inline-flex}
.bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font-size:.78rem;color:var(--ink2);text-decoration:none;cursor:pointer;gap:2px}
.bnav a.on{color:var(--acc);font-weight:700}
.bnav a span{font-size:1.25rem;line-height:1}
.content{padding:12px;padding-bottom:140px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
.sync{font-size:.8rem;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:default}
.sync.off{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.sync.ok{background:var(--okbg);color:var(--ok)}
.sync.bad{background:var(--badbg);color:var(--bad);cursor:pointer}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(400px,100%);padding:28px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:900px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stat b{display:block;font-size:1.9rem;line-height:1.1;color:var(--acc)}
/* list rows */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px}
.row .plate{font:700 1.1rem Arial,"Noto Sans TC",sans-serif;letter-spacing:.04em;min-width:104px}
.row .meta{flex:1;min-width:200px;font-size:.88rem;color:var(--ink2)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
details.flt>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500}
/* wizard */
.wiz{display:flex;justify-content:space-between;gap:4px;margin-bottom:6px}
.wiz button{flex:1;min-width:0;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;color:var(--mute)}
.wiz button{padding:0 4px;overflow:hidden;white-space:nowrap;font-size:.85rem}.wn{display:none;margin-left:4px;font-weight:500}@media(min-width:900px){.wn{display:inline}}
.wiz button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wiz button.done{color:var(--acc);border-color:var(--acc)}
.wizlbl{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 12px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.foot .btn{flex:1;max-width:220px}
.foot .sp{flex:1}
@media(min-width:900px){.foot{left:232px}}
@media(max-width:899px){.foot{bottom:56px;padding-bottom:10px}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);cursor:pointer}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
/* photos */
.pbar{border:1px dashed var(--acc);background:var(--accbg);border-radius:var(--r);padding:12px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000;cursor:grab}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:0 6px;border-radius:99px}
.ph .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:rgba(0,0,0,.55)}
.ph .ctl button{background:none;border:0;color:#fff;min-width:30px;min-height:30px;cursor:pointer}
.ph.over{outline:3px solid var(--acc)}
.empty{padding:22px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:var(--r)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb img{max-width:100%;max-height:100%}
.lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:1.3rem;cursor:pointer}
/* diagram */
.dgs{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.dgs{grid-template-columns:1fr 1fr;align-items:start}}
@media(max-width:899px){.dgblock:not(.cur){display:none}}
.dgwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:6px;max-width:560px;margin:0 auto}
.dgwrap svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dgwrap .mk{cursor:grab;touch-action:none}
.dgwrap .mk text{pointer-events:none}
.slot{fill:transparent;stroke:#6f7e8b;stroke-width:2;stroke-dasharray:7 6}
.slot.lk{stroke:#b3261e}
.ring{fill:none;stroke:#0b5d6b;stroke-width:4}
.mkbar{margin-bottom:6px}
.mksel .sel{margin-top:10px;padding:10px;border:1px solid var(--acc);border-radius:var(--r);background:var(--accbg)}
.count{font-weight:700;color:var(--acc)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.md{background:var(--card);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px}
@media(min-width:700px){.md{border-radius:14px}}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;z-index:120;max-width:90%;font-size:.92rem}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.split{grid-template-columns:300px 1fr}}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--card);cursor:pointer;min-height:44px}
.li.on{border-color:var(--acc);background:var(--accbg)}
.li.off{opacity:.55}
.cmp{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.cmp table{border-collapse:collapse;width:100%;font-size:.9rem}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;min-width:130px}
.cmp th:first-child,.cmp td:first-child{min-width:84px;position:sticky;left:0;background:var(--paper);font-weight:700;z-index:1}
.diff{color:var(--warn);font-weight:700;display:block}
.diff.ok{color:var(--ok)}
/* report */
.rptbox{overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:#ddd;padding:0}
.rpt .page{width:794px;height:1123px;padding:26px 30px 34px;background:#fff;color:#000;position:relative;overflow:hidden;box-sizing:border-box;line-height:1.35}
.rpt .page+.page{margin-top:14px}
.rpt h1{font-size:1.5em;text-align:center;letter-spacing:.3em;margin:0}
.rpt .hd{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
.rpt .hd img{height:42px}
.rpt .hd .co{font-size:.9em}
.rpt .ib{display:grid;border-top:1px solid #000;border-left:1px solid #000}
.rpt .ib div{border-right:1px solid #000;border-bottom:1px solid #000;padding:3px 6px;min-height:24px}
.rpt .ib small{color:#444;margin-right:4px}
.rpt .ib b{font-weight:700}
.rpt .sec{font-weight:700;margin:8px 0 3px;font-size:1em}
.rpt .cks{display:grid;gap:2px 4px;border:1px solid #000;padding:5px 6px}
.rpt .ck{display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:.92em}
.rpt .cb{display:inline-block;width:11px;height:11px;border:1.3px solid #000;position:relative;flex:none}
.rpt .cb.on::after{content:"";position:absolute;left:2.5px;top:-1px;width:3.5px;height:7.5px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(40deg)}
.rpt .dgr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rpt .dgr img{width:100%;height:auto;max-height:100%;object-fit:contain;display:block}
.rpt .note{border:1px solid #000;padding:6px 8px;min-height:60px}
.rpt .ftr{position:absolute;left:30px;right:30px;bottom:12px;display:flex;justify-content:space-between;font-size:.8em;color:#444}
.rpt .pg{display:grid;gap:8px}
.rpt .pc{border:1px solid #999;position:relative;display:flex;align-items:center;justify-content:center;background:#fafafa;overflow:hidden}
.rpt .pc img{width:100%;height:100%;object-fit:cover}
.rpt .pc i{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font:normal .75em sans-serif;padding:0 5px}
.rpt .none{color:#888;font-size:1.1em}
.rpt .ph2{grid-column:1/-1;font-weight:700;border-bottom:1.5px solid #000;padding-bottom:2px}
#printRoot{display:none}
.nb .foot{bottom:0!important;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))!important}.nb .content{padding-bottom:110px}
.dgblock{min-width:0}
@media print{body>#app,.toast,.ov{display:none!important}#printRoot{display:block}#printRoot .page{page-break-after:always;margin:0!important}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printRoot" class="rpt"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" class="hide">
<input type="file" id="galIn" accept="image/*" multiple class="hide">
<input type="file" id="impIn" accept="application/json" class="hide">
<input type="file" id="logoIn" accept="image/*" class="hide">

/* ---------- storage ---------- */
const STORES=['users','inspections','brands','models','templates','pdfTpls','photos','logs','kv'];
let DB=null,MEM=false;const mem={};STORES.forEach(s=>mem[s]={});
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('kyInspect',1);r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{const o=d.createObjectStore(s,{keyPath:'id'});if(s==='photos')o.createIndex('ins','ins')})};r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>{MEM=true;res()};r.onblocked=()=>{MEM=true;res()}}catch(e){MEM=true;res()}})}
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const os=(s,m='readonly')=>DB.transaction(s,m).objectStore(s);
const dbAll=async s=>MEM?Object.values(mem[s]):rq(os(s).getAll());
const dbGet=async(s,id)=>MEM?mem[s][id]:rq(os(s).get(id));
const dbPut=async(s,o)=>{if(MEM){mem[s][o.id]=o;return}return rq(os(s,'readwrite').put(o))};
const dbDel=async(s,id)=>{if(MEM){delete mem[s][id];return}return rq(os(s,'readwrite').delete(id))};
const photosOf=async id=>{const a=MEM?Object.values(mem.photos).filter(p=>p.ins===id):await rq(os('photos').index('ins').getAll(id));return a.sort((x,y)=>(x.order||0)-(y.order||0))};
async function photoCounts(){const c={};if(MEM){Object.values(mem.photos).forEach(p=>c[p.ins]=(c[p.ins]||0)+1);return c}return new Promise(ok=>{const r=os('photos').index('ins').openKeyCursor();r.onsuccess=()=>{const cu=r.result;if(cu){c[cu.key]=(c[cu.key]||0)+1;cu.continue()}else ok(c)};r.onerror=()=>ok(c)})}
const S={users:[],inspections:[],brands:[],models:[],templates:[],pdfTpls:[],logs:[],cfg:null,me:null,view:'dash',step:0,sym:'P',sel:null,online:navigator.onLine,sync:'ok',q:{},cmp:[],fgroup:0,pcat:{},burst:false,menu:false};
async function loadAll(){for(const s of['users','inspections','brands','models','templates','pdfTpls','logs'])S[s]=await dbAll(s);S.cfg=await dbGet('kv','cfg')}
async function save(s,o){await dbPut(s,o);if(S[s]){const i=S[s].findIndex(x=>x.id===o.id);if(i<0)S[s].push(o);else S[s][i]=o}return o}
async function remove(s,id){await dbDel(s,id);if(S[s])S[s]=S[s].filter(x=>x.id!==id)}
async function saveCfg(){await dbPut('kv',S.cfg)}
async function log(action,detail=''){try{await save('logs',{id:uid(),ts:Date.now(),user:S.me?.username||'-',action,detail});if(S.logs.length>3000){const old=S.logs.sort((a,b)=>a.ts-b.ts).slice(0,500);for(const o of old)await remove('logs',o.id)}}catch(e){}}

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ky:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+s}}

function diagramSVG(v,marks,st,o={}){
 const W=1000,H=svgH(v);let s=`<svg class="dg" viewBox="0 0 ${W} ${H}" data-view="${v}"><image href="${IMG[v]}" width="${W}" height="${H}"/>`;
 const tx=(m,l)=>{const t=mst(st,m);return`<text x="${m.x*W}" y="${m.y*H}" text-anchor="middle" dominant-baseline="central" style="font-family:${t.ff},Arial,sans-serif;font-weight:${t.fw};font-size:${t.fs}px" fill="${t.col}">${esc(l)}</text>`};
 if(o.tplMode){for(const m of marks)s+=`<g class="mk" data-id="${m.id}"><circle class="slot${m.locked?' lk':''}" cx="${m.x*W}" cy="${m.y*H}" r="44"/>${m.label?tx(m,m.label):''}${o.sel===m.id?`<circle class="ring" cx="${m.x*W}" cy="${m.y*H}" r="52"/>`:''}</g>`}
 else{for(const m of o.slots||[])s+=`<circle class="slot" style="pointer-events:none" cx="${m.x*W}" cy="${m.y*H}" r="44"/>`;
  for(const m of marks)s+=`<g class="mk" data-id="${m.id}"><circle cx="${m.x*W}" cy="${m.y*H}" r="30" fill="transparent"/>${tx(m,m.sym)}${o.sel===m.id?`<circle class="ring" cx="${m.x*W}" cy="${m.y*H}" r="34"/>`:''}</g>`}
 return s+'</svg>'}
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
const IMGC={};
async function diagramPNG(v,marks,st,slots){const W=1000,H=svgH(v);const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);IMGC[v]=IMGC[v]||await loadImg(IMG[v]);x.drawImage(IMGC[v],0,0,W,H);
 if(slots){x.strokeStyle='#8a97a3';x.lineWidth=2;x.setLineDash([7,6]);for(const m of slots){x.beginPath();x.arc(m.x*W,m.y*H,44,0,7);x.stroke()}x.setLineDash([])}
 x.textAlign='center';x.textBaseline='middle';for(const m of marks){const t=mst(st,m);x.font=`${t.fw} ${t.fs}px ${t.ff},Arial,sans-serif`;x.fillStyle=t.col;x.fillText(m.sym,m.x*W,m.y*H)}return c.toDataURL('image/png')}

document.addEventListener('pointerup',e=>{if(!DR)return;const d=DR;DR=null;const c=d.c,H=svgH(c.v);
 if(d.moved){dirty(d.w);redrawDg();return}
 if(d.m){S.sel={v:c.v,id:d.m.id};redrawDg();return}
 if(!d.svg.isConnected)return;const p=svgPt(d.svg,e);let x=p.x,y=p.y;

 let best=null,bd=46;for(const s of c.slots||[]){const dd=Math.hypot((s.x-x)*1000,(s.y-y)*H);if(dd<bd){bd=dd;best=s}}if(best){x=best.x;y=best.y}
 const near=c.list.find(k=>Math.hypot((k.x-x)*1000,(k.y-y)*H)<30);if(near){S.sel={v:c.v,id:near.id};redrawDg();return}
 const n={id:uid(),view:c.v,sym:S.sym,x,y};S.cur.marks.push(n);S.sel={v:c.v,id:n.id};touch();redrawDg()});

async function compress(file,max=1280,q=.72){let im;try{im=await createImageBitmap(file)}catch(e){const url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});im=await loadImg(url)}const w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

 case'delins':{const i=selById(S.inspections,id);if(!await confirmBox(`確定刪除 ${i.plate||'這筆查定'}？照片也會一併刪除，無法復原。`,'刪除'))break;for(const p of await photosOf(id))await dbDel('photos',p.id);await remove('inspections',id);S.cmp=S.cmp.filter(x=>x!==id);log('刪除查定',i.plate);refreshContent();break}
 case'cmpck':S.cmp=t.checked?[...new Set([...S.cmp,id])]:S.cmp.filter(x=>x!==id);refreshContent();break;
 case'goCmp':go('cmp');break;case'cmpAll':S.cmp=S.inspections.filter(i=>(i.plate||'').toUpperCase()===S.hist.toUpperCase()).map(i=>i.id);go('cmp');break;case'clrcmp':S.cmp=[];go('list');break;
 case'clrq':S.q={};refreshContent();break;
 case'step':setStep(Number(t.dataset.i));break;case'prev':setStep(S.step-1);break;case'next':setStep(S.step+1);break;
 case'sym':S.sym=t.dataset.v;redrawDg();break;
 case'mkchg':{const m=selMark();if(m){m.sym=S.sym;touch();redrawDg()}break}
 case'mkdel':{const l=S.view==='tplEdit'?S.te.marks:S.cur.marks;const i=l.findIndex(k=>k.id===S.sel?.id);if(i>=0)l.splice(i,1);S.sel=null;S.view==='tplEdit'?S.teDirty=true:touch();redrawDg();break}
 case'mkun':S.sel=null;redrawDg();break;
 case'cam':S.pcatNow=t.dataset.cat;$('#camIn').click();break;case'gal':S.pcatNow=t.dataset.cat;$('#galIn').click();break;
 case'lb':openLb(id);break;case'phl':movePhoto(id,-1);break;case'phrt':movePhoto(id,1);break;case'phd':delPhoto(id);break;
 case'fg':S.fgroup=Number(t.dataset.i);renderEdit(true);break;
 case'phr':{const p=S.cfg.phrases[Number(t.dataset.i)];c.phrases=c.phrases.includes(p)?c.phrases.filter(x=>x!==p):[...c.phrases,p];touch();renderEdit(true);break}
 case'addphr':{const v=$('#newPhr').value.trim().replace(/[。.]+$/,'');if(!v)return;if(!S.cfg.phrases.includes(v)){S.cfg.phrases.push(v);await saveCfg()}if(!c.phrases.includes(v))c.phrases.push(v);touch();renderEdit(true);break}
 case'done':{if(!c.plate.trim()){toast('請先在「基本資料」填寫車牌號碼');setStep(0);break}c.status='done';c.modified=Date.now();c.synced=false;c._d=1;await persistCur();log(S.isNew?'新增查定':'完成查定',c.plate);toast('查定已儲存');S.isNew=false;setStep(8);syncNow();break}
 case'leave':await persistCur();go('list');break;
 case'rpPrint':printReport(c);break;case'rpPdf':downloadPdf(c);break;case'zipOne':zipPhotos([c]);break;
 case'phck':S.phSel=t.checked?[...new Set([...(S.phSel||[]),id])]:(S.phSel||[]).filter(x=>x!==id);break;
 case'phv':viewPhotos(id);break;case'zip1':zipPhotos([selById(S.inspections,id)]);break;
 case'zipSel':{const l=(S.phSel||[]).map(x=>selById(S.inspections,x)).filter(Boolean);if(!l.length)return toast('請先勾選要下載的查定');zipPhotos(l);break}
 /* brands */
 case'selBrand':S.selBrand=id;S.mq='';render();break;
 case'bAdd':{const r=await askForm('新增廠牌',[{k:'name',l:'廠牌名稱',req:1}]);if(!r)break;const b={id:uid(),name:r.name.trim().toUpperCase(),active:true,order:Math.max(0,...S.brands.map(x=>x.order))+1};await save('brands',b);S.selBrand=b.id;log('新增廠牌',b.name);render();break}
 case'bEd':{const b=selById(S.brands,id);const r=await askForm('編輯廠牌',[{k:'name',l:'廠牌名稱',req:1}],b);if(!r)break;const old=b.name;b.name=r.name.trim();await save('brands',b);for(const i of S.inspections.filter(i=>i.brand===old)){i.brand=b.name;await save('inspections',i)}log('編輯廠牌',b.name);refreshBM();break}
 case'bTg':{const b=selById(S.brands,id);b.active=!b.active;await save('brands',b);refreshBM();break}
 case'bUp':case'bDn':{const s=[...S.brands].sort((x,y)=>x.order-y.order);const i=s.findIndex(x=>x.id===id),j=i+(a==='bUp'?-1:1);if(j<0||j>=s.length)break;const o=s[i].order;s[i].order=s[j].order;s[j].order=o;await save('brands',s[i]);await save('brands',s[j]);refreshBM();break}
 case'bDl':{const b=selById(S.brands,id);if(!await confirmBox(`刪除廠牌「${b.name}」及其所有車型？（已存在的查定紀錄不受影響）`,'刪除'))break;for(const m of S.models.filter(m=>m.brand===id))await remove('models',m.id);await remove('brands',id);log('刪除廠牌',b.name);render();break}
 case'mAdd':modelForm({active:true},'新增車型');break;case'mEd':modelForm(selById(S.models,id),'編輯車型');break;
 case'mTg':{const m=selById(S.models,id);m.active=!m.active;await save('models',m);refreshBM();break}
 case'mDl':{const m=selById(S.models,id);if(!await confirmBox(`刪除車型「${m.name}」？`,'刪除'))break;await remove('models',id);refreshBM();break}
 case'mAi':aiModel();break;
 /* mark templates */
 case'tAdd':{const r=await askForm('新增模板',[{k:'name',l:'模板名稱',req:1},{k:'type',l:'車型類別',ph:'例：一般轎車'}]);if(!r)break;const d=S.templates.find(x=>x.isDefault)||S.templates[0];await save('templates',{...clone(d),id:uid(),name:r.name,type:r.type,isDefault:false});render();break}
 case'tEd':S.te=clone(selById(S.templates,id));S.teDirty=false;go('tplEdit');break;
 case'tCp':{const d=selById(S.templates,id);await save('templates',{...clone(d),id:uid(),name:d.name+' 複製',isDefault:false});render();break}
 case'tDf':for(const x of S.templates){x.isDefault=x.id===id;await save('templates',x)}render();break;
 case'tDl':{if(S.templates.length<2)return toast('至少要保留一個模板');const d=selById(S.templates,id);if(!await confirmBox(`刪除模板「${d.name}」？`,'刪除'))break;await remove('templates',id);if(d.isDefault){const f=S.templates[0];f.isDefault=true;await save('templates',f)}render();break}
 case'tBack':if(S.teDirty&&!await confirmBox('有尚未儲存的變更，確定離開？','離開'))break;go('tpls');break;
 case'tReset':if(await confirmBox('將標記點重設為標準位置？','重設')){S.te.marks=slotSet();S.teDirty=true;S.sel=null;redrawDg()}break;
 case'tSave':{const o=clone(S.te);await save('templates',o);S.teDirty=false;log('儲存標記模板',o.name);toast('模板已儲存');break}
 /* pdf templates */
 case'pAdd':{const b=S.pdfTpls[0];const o=await pdfForm({...b,id:uid(),name:'新模板',isDefault:false,active:true,logo:''},'新增 PDF 模板');if(o){await save('pdfTpls',o);render()}break}
 case'pEd':{const o=await pdfForm(selById(S.pdfTpls,id),'編輯 PDF 模板');if(o){await save('pdfTpls',o);log('編輯PDF模板',o.name);render()}break}
 case'pCp':{const d=selById(S.pdfTpls,id);await save('pdfTpls',{...clone(d),id:uid(),name:d.name+' 複製',isDefault:false});render();break}
 case'pDf':for(const x of S.pdfTpls){x.isDefault=x.id===id;if(x.isDefault)x.active=true;await save('pdfTpls',x)}render();break;
 case'pTg':{const d=selById(S.pdfTpls,id);if(d.active&&d.isDefault)return toast('預設模板不能停用');d.active=!d.active;await save('pdfTpls',d);render();break}
 case'pDl':{if(S.pdfTpls.length<2)return toast('至少要保留一個模板');const d=selById(S.pdfTpls,id);if(!await confirmBox(`刪除模板「${d.name}」？`,'刪除'))break;await remove('pdfTpls',id);if(d.isDefault){const f=S.pdfTpls[0];f.isDefault=true;f.active=true;await save('pdfTpls',f)}render();break}
 case'pLg':{const d=selById(S.pdfTpls,id);if(d.logo&&await confirmBox('移除目前的 Logo？（選「取消」可上傳新的）','移除')){d.logo='';await save('pdfTpls',d);render();break}S.logoFor=id;$('#logoIn').click();break}
 case'pPv':{const d=selById(S.pdfTpls,id);const ins=sortIns(S.inspections)[0]||sampleIns();reportModal(ins,d);break}
 /* users */
 case'uAdd':userForm();break;case'uEd':userForm(selById(S.users,id));break;
 case'uPw':{const u=selById(S.users,id);const r=await askForm('重設密碼：'+u.username,[{k:'n',l:'新密碼',t:'password',req:1}]);if(!r)break;u.pwd=await sha(r.n);await save('users',u);log('重設密碼',u.username);toast('密碼已重設');break}
 case'uRec':S.q={insp:id};go('list');break;
 case'uTg':{const u=selById(S.users,id);if(u.id===S.me.id)return toast('不能停用自己的帳號');u.active=!u.active;await save('users',u);log(u.active?'啟用帳號':'停用帳號',u.username);render();break}
 case'uDl':{const u=selById(S.users,id);if(u.id===S.me.id)return toast('不能刪除自己的帳號');if(u.role==='超級管理員'&&S.users.filter(x=>x.role==='超級管理員').length<2)return toast('至少要保留一位超級管理員');if(!await confirmBox(`刪除帳號「${u.username}」？（他建立的查定紀錄會保留）`,'刪除'))break;await remove('users',id);log('刪除帳號',u.username);render();break}
 case'setSave':saveSettings();break;case'bkOut':backupOut();break;case'bkIn':$('#impIn').click();break;
 case'theme':{const v=t.dataset.v;v?document.documentElement.setAttribute('data-theme',v):document.documentElement.removeAttribute('data-theme');break}
 }
});
const sampleIns=()=>{const i=newInsp();Object.assign(i,{plate:'ABC-1234',brand:'TOYOTA',model:'ALTIS',rating:'A+',interior:'B',mfg:'2020-06',cc:1798,drive:'FF',gear:'CVT',doors:'4',color:'白',body:'房車',fuel:'汽油',mileage:100000,mGuar:'保證',vin:'—',engNo:'—',phrases:PHR.slice(0,3),tires:1});i.equip={'i-Key':{on:true},'ABS':{on:true},'KEY':{on:true,val:'2'}};i.func={'引擎外部異音':true};i.marks=[{id:'a',view:'ext',sym:'P',x:.24,y:.28},{id:'b',view:'ext',sym:'B',x:.72,y:.37},{id:'c',view:'str',sym:'S1',x:.5,y:.4}];return i};
document.addEventListener('input',async e=>{const t=e.target;const c=S.cur;
 if(t.dataset.f!==undefined&&c){const f=t.dataset.f;let v=t.value;if(f==='plate'||f==='vin'||f==='engNo'){v=v.toUpperCase();if(t.value!==v)t.value=v}if(t.type==='radio'&&!t.checked)return;c[f]=v;if(f==='tires')c[f]=Number(v);touch();
  if(f==='brand'){c.model='';renderEdit(true)}if(f==='model'){const b=S.brands.find(x=>x.name===c.brand);const m=b&&S.models.find(x=>x.brand===b.id&&x.name.toUpperCase()===v.toUpperCase());if(m&&e.inputType===undefined||m&&e.inputType==='insertReplacementText'){c.model=m.name;if(!c.cc&&m.cc)c.cc=m.cc;if(!c.doors&&m.doors)c.doors=String(m.doors);if(!c.fuel&&m.fuel)c.fuel=m.fuel;if(!c.drive&&m.drive)c.drive=m.drive;renderEdit(true)}}
  if(f==='sheetOv'||f==='tires'){}return}
 if(t.dataset.eqv!==undefined&&c){(c.equip[t.dataset.eqv]=c.equip[t.dataset.eqv]||{on:true}).val=t.value;touch();return}
 if(t.dataset.q!==undefined){S.q[t.dataset.q]=t.value;$('#lres').innerHTML=listResults();return}
 if(t.dataset.te!==undefined){S.te[t.dataset.te]=t.type==='number'?Number(t.value):t.value;S.teDirty=true;redrawDg(false);return}
 if(t.dataset.tf!==undefined){const m=selMark();if(!m)return;const k=t.dataset.tf;m[k]=k==='locked'?t.checked:k==='fs'?(t.value===''?null:Number(t.value)):t.value;S.teDirty=true;redrawDg(false);return}
 if(t.dataset.bq!==undefined){S.bq=t.value;$('#bl').innerHTML=brandList();return}
 if(t.dataset.mq!==undefined){S.mq=t.value;$('#ml').innerHTML=modelList();return}
 if(t.dataset.lg!==undefined){S.lgq=t.value;$('#lgl').innerHTML=logList();return}
 if(t.name==='role'&&t.closest('#af')){const p=ROLES[t.value];ALLP.forEach(k=>{const el=t.closest('#af').elements['perm_'+k];if(el)el.checked=p.includes(k)})}});
document.addEventListener('change',async e=>{const t=e.target;const c=S.cur;
 if(t.dataset.eq!==undefined&&c){const q=c.equip[t.dataset.eq]=c.equip[t.dataset.eq]||{on:false,val:''};q.on=t.checked;touch();renderEdit(true);return}
 if(t.dataset.fn!==undefined&&c){if(t.checked)c.func[t.dataset.fn]=true;else delete c.func[t.dataset.fn];touch();renderEdit(true);return}
 if(t.dataset.act==='burst'){S.burst=t.checked;return}
 if(t.dataset.act==='tplsel'&&c){const tp=selById(S.templates,t.value);c.tplId=tp.id;c.mstyle={ff:tp.ff,fw:tp.fw,fs:tp.fs,color:tp.color};touch();redrawDg();return}
 if(t.dataset.act==='pdfsel'&&c){c.pdfId=t.value;touch();previewReport();return}
 if(t.dataset.act==='pcat'){S.pcat[t.dataset.step]=t.value;renderEdit(true);return}
 if(t.dataset.f==='model'&&c){const b=S.brands.find(x=>x.name===c.brand);const m=b&&S.models.find(x=>x.brand===b.id&&x.name.toUpperCase()===String(t.value).toUpperCase());if(m){c.model=m.name;if(!c.cc&&m.cc)c.cc=m.cc;if(!c.doors&&m.doors)c.doors=String(m.doors);if(!c.fuel&&m.fuel)c.fuel=m.fuel;if(!c.drive&&m.drive)c.drive=m.drive;touch();renderEdit(true)}return}
 if(t.id==='camIn'||t.id==='galIn'){const fs=[...t.files];t.value='';if(fs.length){await addPhotos(fs,S.pcatNow);if(t.id==='camIn'&&S.burst)setTimeout(()=>{try{$('#camIn').click()}catch(x){}},300)}return}
 if(t.id==='impIn'){const f=t.files[0];t.value='';if(f)backupIn(f);return}
 if(t.id==='logoIn'){const f=t.files[0];t.value='';if(!f)return;try{const d=await compress(f,400,.9);const p=selById(S.pdfTpls,S.logoFor);p.logo=d;await save('pdfTpls',p);toast('Logo 已更新');render()}catch(x){toast('圖片無法讀取')}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistCur()});
window.addEventListener('pagehide',()=>persistCur());
window.addEventListener('online',()=>{S.online=true;updSync();toast('網路已恢復，開始同步');syncNow()});
window.addEventListener('offline',()=>{S.online=false;updSync();toast('目前離線：資料會先存在這台裝置')});
window.addEventListener('resize',()=>{const b=$('#rptBox'),e=$('#rptPrev');if(b&&e)fitRpt(b,e)});
(async()=>{await openDB();await loadAll();await seed();restore();render();if(S.me)syncNow()})();

document.addEventListener('touchmove',e=>{if(DR&&DR.m)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('[role=link][data-act]'))e.target.click()});
