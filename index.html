function pickPhoto(i){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = async ()=>{
        const canvas = document.createElement('canvas');
        const maxW = 640;
        const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        formPhotos[i] = dataUrl;
        buildPhotoGrid();
        await savePhotoSlot(formRecord.id, i, dataUrl);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}
async function removePhoto(i){
  formPhotos[i] = null;
  buildPhotoGrid();
  await savePhotoSlot(formRecord.id, i, null);
}

/* ---- save ---- */
async function saveRecord(){
  formRecord.plate = document.getElementById('f_plate').value.trim();
  formRecord.brand = document.getElementById('f_brand').value;
  formRecord.model = document.getElementById('f_model').value;
  formRecord.bodyGrade = document.getElementById('f_bodyGrade').value;
  formRecord.interiorGrade = document.getElementById('f_interiorGrade').value;
  formRecord.mfgYear = document.getElementById('f_mfgYear').value;
  formRecord.mfgMonth = document.getElementById('f_mfgMonth').value;
  formRecord.cc = document.getElementById('f_cc').value;
  formRecord.drive = document.getElementById('f_drive').value;
  formRecord.doors = document.getElementById('f_doors').value;
  formRecord.wheelbase = document.getElementById('f_wheelbase').value;
  formRecord.mileage = document.getElementById('f_mileage').value;
  formRecord.mileageUnit = document.getElementById('f_mileageUnit').value;
  formRecord.warranty = document.getElementById('f_warranty').checked;
  formRecord.noWarranty = document.getElementById('f_noWarranty').checked;
  formRecord.vin = document.getElementById('f_vin').value.trim();
  formRecord.engineNo = document.getElementById('f_engineNo').value.trim();
  formRecord.gear = document.getElementById('f_gear').value;
  formRecord.fuel = document.getElementById('f_fuel').value;
  formRecord.color = document.getElementById('f_color').value.trim();
  formRecord.bodyType = document.getElementById('f_bodyType').value;
  formRecord.panelCount = document.getElementById('f_panelCount').value;
  formRecord.tireTotal = document.getElementById('f_tireTotal').value;
  formRecord.tireCount = document.getElementById('f_tireCount').value;
  formRecord.customFields = {};
  (activeTemplate.customTabs||[]).flatMap(t=>t.fields||[]).forEach(f=>{
    const el = document.getElementById('cf_'+f.id);
    if(el) formRecord.customFields[f.id] = el.value;
  });

  if(!formRecord.plate){ toast('請輸入車牌號牌'); switchTab('t1'); return; }

  formRecord.templateId = activeTemplate.id;
  activeTemplate.equipment.forEach(eq=>{
    const checked = document.getElementById('eqchk_'+eq.key).checked;
    const qty = (eq.qty || eq.select) ? document.getElementById('eqqty_'+eq.key).value : '';
    formRecord.equipment[eq.key] = {checked, qty};
  });
  activeTemplate.funcChecks.forEach((_,i)=>{
    formRecord.functionChecks[i] = document.getElementById('fcchk_'+i).checked;
  });

  formRecord.photosCount = formPhotos.filter(Boolean).length;
  formRecord.inspectorId = currentUser.id;
  formRecord.inspectorName = currentUser.name;

  const existingIdx = DB.records.findIndex(r=>r.id===formRecord.id);
  if(existingIdx>=0) DB.records[existingIdx] = formRecord;
  else DB.records.push(formRecord);

  const saveBtn = document.querySelector('.btn-stamp[onclick="saveRecord()"]');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = '儲存中…'; }
  // IMPORTANT: the record itself is persisted to ITS OWN key via saveRecordToStorage
  // (records are no longer part of the settings blob saveDB() writes). This was the
  // actual bug behind the mobile save failures — this call was missing entirely, so
  // "儲存查定紀錄" never actually wrote the record to storage in the first place.
  const ok = await saveRecordToStorage(formRecord);
  if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = '儲存查定紀錄'; }

  // photos are already persisted per-slot as they were taken (pickPhoto/removePhoto),
  // so there is no bulk photo save here.
  if(ok){
    if(editingFromDispatchId){
      const d = DB.dispatch.find(x=>x.id===editingFromDispatchId);
      if(d){ d.recordId = formRecord.id; d.status = 'done'; await saveDB(); }
      editingFromDispatchId = null;
    }
    toast('查定紀錄已儲存');
    goto('records');
  }else{
    // stay on the form (don't navigate away) so the user's edits aren't lost and they
    // can just press the button again — DB.records already reflects the edited data.
    toast('儲存失敗：'+(lastStorageError||'請確認網路連線')+'，請再按一次「儲存查定紀錄」重試（表單內容仍保留）', 5000);
  }
}

async function deleteRecord(id){
  const record = DB.records.find(r=>r.id===id);
  if(record && !canEditRecord(record)){
    toast('僅原查定師「'+(record.inspectorName||'')+'」或管理員可刪除此筆查定紀錄');
    return;
  }
  if(!confirm('確定刪除此筆查定紀錄？此動作無法復原。')) return;
  const ok = await deleteRecordFromStorage(id);
  if(!ok){
    toast('刪除失敗：'+(lastStorageError||'請確認網路連線')+'，請再試一次', 5000);
    return;
  }
  DB.records = DB.records.filter(r=>r.id!==id);
  await deleteAllPhotos(id);
  filterRecords();
}

function buildCategorizedFcCells(funcChecks, functionChecks, fcCols){
  const fcW = `calc((100% - ${(fcCols-1)*6}px)/${fcCols})`;
  const categories = [];
  const byCategory = {};
  funcChecks.forEach((item,i)=>{
    const cat = fcItemCategory(item);
    if(!byCategory[cat]){ byCategory[cat]=[]; categories.push(cat); }
    byCategory[cat].push(i);
  });
  return categories.map(cat=>{
    const itemsHtml = byCategory[cat].map(i=>{
      const label = fcItemLabel(funcChecks[i]);
      return `<div class="rp-chk-i" style="flex:0 0 ${fcW};max-width:${fcW};"><span class="rp-box">${functionChecks[i]?'☑':'☐'}</span>${label}</div>`;
    }).join('');
    return `<div class="rp-fc-category"><div class="rp-fc-category-title">${cat}</div><div class="rp-chk-grid" style="margin-bottom:4px;">${itemsHtml}</div></div>`;
  }).join('');
}
function buildCustomFieldsLine(record, template){
  const tabs = template.customTabs || [];
  const lines = tabs.map(tab=>{
    const parts = (tab.fields||[])
      .map(f => ({label:f.label, val:(record.customFields||{})[f.id]}))
      .filter(p => p.val);
    if(parts.length===0) return '';
    const prefix = tabs.length>1 ? `<b>【${tab.name}】</b>　` : '';
    return `<div style="border:1px solid #000;border-top:none;padding:5px 10px;font-size:11px;">${prefix}${parts.map(p=>`<b>${p.label}</b>：${p.val}`).join('　　')}</div>`;
  }).filter(Boolean);
  return lines.join('');
}

function showReportModal(innerHTML, recordId){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  // NOTE: only ONE scrollable container here (the modal-box itself, via its own
  // overflow:auto in CSS). A second nested overflow:auto around the report content
  // used to create a "scroll trap" on iOS Safari where touch-scrolling the inner
  // box could lock up and make the modal feel unresponsive/unusable. We still keep
  // that guarantee here — on narrow screens the report is scaled DOWN to fit instead
  // of relying on a second (horizontal) scroll axis, which on mobile used to show
  // only a thin unreadable sliver of each row instead of the actual page layout.
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:900px;-webkit-overflow-scrolling:touch;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:#fff;z-index:2;padding-bottom:6px;">
        <h3 style="margin:0;">PDF 報告預覽</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${recordId?`<button class="btn btn-stamp btn-sm" onclick="downloadPDFForRecord('${recordId}')">下載 PDF</button>`:''}
          <button class="btn btn-ghost btn-sm" onclick="this.closest('.modal-overlay').remove()">關閉</button>
        </div>
      </div>
      <div class="rp-preview-viewport" style="border:1px solid var(--line);overflow:hidden;">
        <div class="rp-preview-inner" style="width:794px;">${innerHTML}</div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>{
    const viewport = overlay.querySelector('.rp-preview-viewport');
    const inner = overlay.querySelector('.rp-preview-inner');
    const availWidth = viewport.clientWidth;
    if(availWidth > 0 && availWidth < 794){
      const scale = availWidth / 794;
      const naturalHeight = inner.scrollHeight;
      inner.style.transform = 'scale('+scale+')';
      inner.style.transformOrigin = 'top left';
      viewport.style.height = Math.ceil(naturalHeight * scale) + 'px';
    }
  });
}

async function downloadPDFForRecord(id){
  const record = DB.records.find(r=>r.id===id);
  if(!record){ toast('請先儲存查定紀錄再下載 PDF'); return; }
  if(typeof html2canvas === 'undefined' || !window.jspdf){
    toast('PDF 產生工具尚未載入完成，請確認網路連線後重新整理頁面再試一次');
    return;
  }
  // Reserve a blank tab RIGHT NOW, synchronously, while this click still counts as a
  // "user gesture". Mobile Safari/Chrome block window.open() if it happens after several
  // awaits (which is exactly what html2canvas/jsPDF need) — pre-opening and filling it
  // in later avoids that popup block.
  let preOpenedTab = null;
  try{ preOpenedTab = window.open('', '_blank'); }catch(e){}
  toast('PDF 產生中，請稍候…');
  try{
    const photos = await getPhotos(id);
    const html = buildReportHTML(record, photos);
    const container = document.getElementById('reportTemplate');
    container.innerHTML = html;
    container.style.top = '0px'; container.style.left = '0px'; container.style.zIndex = '-1';
    container.style.position = 'fixed'; container.style.opacity = '0'; container.style.pointerEvents = 'none';
    // Wait for the actual web fonts (Noto Sans TC etc.) to finish loading before capturing.
    // Google Fonts use font-display:swap, so the page briefly renders with a fallback font
    // and then swaps once the real font arrives — if html2canvas captures during that
    // fallback window, text metrics differ from what's shown on screen and things can
    // shift/overflow/misalign in the resulting PDF even though the live preview looks fine.
    try{
      if(document.fonts && document.fonts.ready) await document.fonts.ready;
    }catch(e){}
    await new Promise(r=>setTimeout(r,300));

    // capture EVERY .rp-page (main form + photo appendix) instead of just the first one
    const pages = Array.from(container.querySelectorAll('.rp-page'));
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();

    for(let p=0; p<pages.length; p++){
      const canvas = await html2canvas(pages[p], {scale:2, useCORS:true});
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      if(p===0){
        // Main report ("一頁式"): always exactly ONE page — scale to fit within the
        // page bounds (both width and height) instead of letting it spill onto a
        // second page. Photos live on their own separate page(s), never here.
        const fitRatio = Math.min(pageWidth/canvas.width, pageHeight/canvas.height);
        const w = canvas.width*fitRatio, h = canvas.height*fitRatio;
        const x = (pageWidth-w)/2, y = (pageHeight-h)/2;
        pdf.addImage(imgData,'JPEG',x,y,w,h);
      }else{
        // Photo appendix: normal tiling across as many pages as needed.
        const imgWidth = pageWidth;
        const imgHeight = canvas.height * (imgWidth/canvas.width);
        let heightLeft = imgHeight;
        let position = 0;
        pdf.addPage();
        pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
        heightLeft -= pageHeight;
        while(heightLeft > 0){
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
          heightLeft -= pageHeight;
        }
      }
    }
    container.innerHTML = '';

    const filename = '查定報告_' + (record.plate||record.id) + '.pdf';
    // data URI (not a blob URL) — blob: URLs frequently fail to open in a NEW tab on
    // iOS Safari because the blob is scoped to the tab that created it. A data URI is
    // fully self-contained, so it opens reliably regardless of which tab/window it's in.
    const dataUri = pdf.output('datauristring');

    let opened = false;
    if(preOpenedTab && !preOpenedTab.closed){
      try{ preOpenedTab.location.href = dataUri; opened = true; }catch(e){ console.warn('could not navigate pre-opened tab', e); }
    }
    if(!opened){
      try{ pdf.save(filename); }catch(e){ console.warn('pdf.save() failed', e); }
    }
    // Always also show a manual link as a guaranteed fallback — tapping it is a fresh
    // user gesture, so it works even if the automatic paths above were blocked.
    showPdfReadyModal(dataUri, filename);
    toast('PDF 已產生');
  }catch(err){
    if(preOpenedTab && !preOpenedTab.closed){ try{ preOpenedTab.close(); }catch(e){} }
    console.error('PDF generation failed', err);
    toast('PDF 產生失敗：' + (err && err.message ? err.message : '未知錯誤') + '，請稍後再試');
  }
}
function showPdfReadyModal(dataUri, filename){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box" style="max-width:360px;text-align:center;">
      <h3>PDF 已產生</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">若沒有自動開啟新分頁或下載，請點下方按鈕手動開啟／儲存。</p>
      <a href="${dataUri}" download="${filename}" target="_blank" class="btn btn-stamp" style="display:block;text-decoration:none;margin-bottom:10px;">開啟／下載 PDF</a>
      <button class="btn btn-ghost" style="width:100%;" onclick="this.closest('.modal-overlay').remove()">關閉</button>
    </div>`;
  document.body.appendChild(overlay);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  // Safety net: no matter what goes wrong during startup (Firebase hanging despite its
  // own timeout, some other unexpected slow call, etc.), the login button must become
  // usable within a bounded time. If normal init hasn't finished by then, fall back to
  // an in-memory default DB so the built-in admin/admin account still works — better a
  // temporarily-degraded local session than a login screen that never responds.
  const startupTimeout = setTimeout(()=>{
    if(!DB){
      console.warn('startup taking too long — falling back to default DB so login still works');
      DB = defaultDB();
      DB.equipment = JSON.parse(JSON.stringify(DEFAULT_EQUIPMENT));
      DB.funcChecks = DEFAULT_FUNC_CHECKS.slice();
      DB.formTemplates = [{ id:'tpl_default', name:'標準查定表', equipment: DB.equipment, funcChecks: DB.funcChecks }];
      DB._storageUnavailable = true;
    }
    enableLoginButton();
  }, 9000);

  await initFirebase();
  await initGSheets();
  await initJSONBin();
  await loadDB();
  clearTimeout(startupTimeout);
  enableLoginButton();

  document.getElementById('loginUser').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
})();
function enableLoginButton(){
  const btn = document.getElementById('loginBtn');
  if(btn){ btn.disabled = false; btn.textContent = '登入系統'; }
}
</script>
